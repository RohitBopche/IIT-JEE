- n: 3
  s: M
  sec: A
  p: 16
  t: S
  q: |-
    Let $\alpha \in \mathbb{R}$ be such that the function $f(x) = \begin{cases} \frac{\cos^{-1}(1 - \{x\}^2)\sin^{-1}(1 - \{x\})}{\{x\} - \{x\}^3}, & x \neq 0 \\ \alpha, & x = 0 \end{cases}$ is continuous at x = 0, where {x} = x – [x], [x] is the greatest integer less than or equal to x. Then :
  o: ['$\alpha = \frac{\pi}{\sqrt{2}}$', '$\alpha = 0$', 'no such $\alpha$ exists', '$\alpha = \frac{\pi}{4}$']
  a: C
  ch: Limits, Continuity and Differentiability
  tp: Continuity with fractional part
  df: H
