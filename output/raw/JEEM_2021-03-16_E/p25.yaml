- n: 4
  s: M
  sec: B
  p: 24
  t: N
  q: |-
    For real numbers $\alpha$, $\beta$, $\gamma$ and $\delta$, if $\int\frac{(x^2 - 1) + \tan^{-1}\left(\frac{x^2 + 1}{x}\right)}{(x^4 + 3x^2 + 1)\tan^{-1}\left(\frac{x^2 + 1}{x}\right)}dx = \alpha\log_e\left(\tan^{-1}\left(\frac{x^2 + 1}{x}\right)\right) + \beta\tan^{-1}\left(\frac{\gamma(x^2 - 1)}{x}\right) + \delta\tan^{-1}\left(\frac{x^2 + 1}{x}\right) + C$ where C is an arbitrary constant, then the value of $10(\alpha + \beta\gamma + \delta)$ is equal to __________.
  a: '6'
  ch: Indefinite Integration
  tp: Substitution, standard forms
  df: H
