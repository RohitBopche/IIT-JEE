    Let $f : \mathbb{R} \rightarrow \mathbb{R}$ and $g : \mathbb{R} \rightarrow \mathbb{R}$ be defined as $f(x) = \begin{cases} x + a, & x < 0 \\ |x - 1|, & x \ge 0 \end{cases}$ and $g(x) = \begin{cases} x + 1, & x < 0 \\ (x - 1)^2 + b, & x \ge 0 \end{cases}$ where a, b are non-negative real numbers. If (gof)(x) is continuous for all $x \in \mathbb{R}$, then a + b is equal to ___________.
  a: '1'
  ch: Limits, Continuity and Differentiability
  tp: Continuity of composite function
