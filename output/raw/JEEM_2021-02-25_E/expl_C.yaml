C A 1: |-
  Concept: Dimethylglyoxime (DMG) test for nickel.
  Solution:
  1. Statement I: $Ni^{2+}$ gives a rosy-red precipitate of bis(dimethylglyoximato)nickel(II) with DMG in ammoniacal ($NH_4OH$) solution. True.
  2. Statement II: in the complex, DMG loses one proton and binds as the uninegative bidentate ligand dmg⁻ (through two N atoms), not as a neutral ligand. False.
  Answer: (D)
C A 2: |-
  Concept: Carbylamine test: a primary amine + $CHCl_3$ + alcoholic KOH gives a foul-smelling isocyanide.
  Solution:
  1. $C_6H_5NH_2 + CHCl_3 + 3KOH \rightarrow C_6H_5NC + 3KCl + 3H_2O$.
  2. The product is phenyl isocyanide (phenyl carbylamine).
  Answer: (B)
C A 3: |-
  Concept: Bond dissociation enthalpy of the halogens generally falls with size, but $F_2$ is anomalously low.
  Solution:
  1. In $F_2$ the small atoms bring the lone pairs very close, and their repulsion weakens the F–F bond (158 kJ/mol).
  2. Values: $Cl_2$ 242 > $Br_2$ 192 > $F_2$ 158 > $I_2$ 151 kJ/mol.
  Answer: (C)
C A 4: |-
  Concept: Properties of lyophilic (hydrophilic) sols.
  Solution:
  1. They are reversible, stable (hard to coagulate, extensively solvated) and do not need electrolytes for stability, so (A), (B) and (C) are true.
  2. Their viscosity is much higher than that of water, so (D) is false.
  Answer: (D)
C A 5: |-
  Concept: Water (steam) reacts with carbon and hydrocarbons to form CO + $H_2$.
  Solution:
  1. $C + H_2O \rightarrow CO + H_2$ (water gas); $CH_4 + H_2O \rightarrow CO + 3H_2$ and $C_3H_8 + 3H_2O \rightarrow 3CO + 7H_2$ (steam reforming over Ni).
  2. $CO_2 + H_2O \rightleftharpoons H_2CO_3$ gives no CO.
  Answer: (D)
C A 6: |-
  Concept: Heating a glycol with oxalic acid forms an oxalate/formate ester that loses $CO_2$.
  Solution:
  1. Ethylene glycol and oxalic acid at about 210 °C form the ester, which decomposes with loss of $CO_2$ and water.
  2. The two hydroxyl-bearing carbons end up joined by a double bond: X = ethene, $CH_2=CH_2$ (analogous to glycerol + oxalic acid giving allyl alcohol).
  Answer: (A)
C A 7: |-
  Concept: Count unpaired electrons, using crystal field splitting.
  Solution:
  1. (i) $[FeF_6]^{3-}$: $Fe^{3+}$ $d^5$, weak field, high spin, 5 unpaired: 5.92 BM.
  2. (iii) $[NiCl_4]^{2-}$: $Ni^{2+}$ $d^8$, tetrahedral, 2 unpaired: 2.83 BM.
  3. (iv) $[Cu(NH_3)_4]^{2+}$: $Cu^{2+}$ $d^9$, 1 unpaired: 1.73 BM.
  4. (ii) $[Co(NH_3)_6]^{3+}$: $Co^{3+}$ $d^6$, low spin, 0 unpaired: 0 BM.
  5. Order: (i) > (iii) > (iv) > (ii).
  Answer: (D)
C A 8: |-
  Concept: Friedel–Crafts alkylation through a carbocation from an alkene + acid; avoid carbocations next to the electron-withdrawing $-NO_2$.
  Solution:
  1. $H^+$ adds to the terminal $CH_2$ (Markovnikov), giving $CH_3CH(NO_2)\overset{+}{C}HCH_3$.
  2. A hydride shift would put the positive charge on the carbon bearing $-NO_2$, which is strongly destabilised, so no rearrangement occurs.
  3. Benzene attacks this carbocation: $C_6H_5CH(CH_3)CH(NO_2)CH_3$.
  Answer: (D)
C A 9: |-
  Concept: Plan an aromatic synthesis using directing effects; alkylate by acylation followed by reduction.
  Solution:
  1. $CH_3COCl/AlCl_3$: acetophenone (avoids polyalkylation and rearrangement).
  2. Zn–Hg/HCl (Clemmensen): ethylbenzene, now an o/p-directing activated ring.
  3. $Br_2/AlBr_3$: mainly 4-bromoethylbenzene (para, less hindered).
  4. $HNO_3/H_2SO_4$: $-NO_2$ goes ortho to the activating ethyl group, giving 4-bromo-2-nitroethylbenzene.
  5. The other sequences place a meta-director (acetyl or $-NO_2$) at the wrong stage.
  Answer: (B)
C A 10: |-
  Concept: Composition of alloys.
  Solution:
  1. German silver (nickel silver) is Cu (about 50%), Zn (about 30%) and Ni (about 20%). It contains no silver, despite the name.
  Answer: (D)
C A 11: |-
  Concept: Zone refining purifies elements of very high purity needs (semiconductors).
  Solution:
  1. Impurities are more soluble in the melt than in the solid, so a moving molten zone sweeps them to one end.
  2. It is used for Si, Ge, B, Ga and In.
  3. The van Arkel method is for Ti and Zr, vapour phase refining for Ni and Zr, and liquation for low-melting metals like Sn.
  Answer: (C)
C A 12: |-
  Concept: Maltose = two α-D-glucopyranose units joined by an α(1→4) glycosidic bond; the α-anomer has an α (downward, axial in Haworth) OH at C1 of the reducing unit.
  Solution:
  1. The correct structure must have: both rings D-glucose (C2, C3, C4 OH pattern of glucose), the C1–O–C4' link with the glycosidic oxygen below the ring (α), and the free anomeric OH on the second unit also below the ring (α).
  2. Structure (4) shows all three features; the others have a β-linkage or β anomeric OH, or wrong OH positions.
  Answer: (D)
C A 13: |-
  Concept: Hydroformylation (oxo process): alkene + CO + $H_2$ over a Rh (or Co) catalyst adds H and CHO across the C=C, mainly giving the linear aldehyde.
  Solution:
  1. $CH_3CH_2CH=CH_2 + CO + H_2 \rightarrow CH_3CH_2CH_2CH_2CHO$ (pentanal), one carbon longer than the alkene.
  Answer: (C)
C A 14: |-
  Concept: Carboxylic acids are stronger than phenols; electron-withdrawing groups increase acidity and electron-donating groups decrease it.
  Solution:
  1. p-Nitrobenzoic acid (–NO₂ withdraws electrons, pKa ≈ 3.4) > benzoic acid (4.2) > p-toluic acid (–CH₃ donates, 4.4) > phenol (10).
  2. Order: II > III > IV > I.
  Answer: (A)
C A 15: |-
  Concept: VSEPR theory: axial and equatorial positions in trigonal-bipyramidal geometry have different bond lengths.
  Solution:
  1. $SF_4$: 4 bond pairs + 1 lone pair (see-saw). Axial S–F bonds are longer than equatorial ones.
  2. $XeF_4$ (square planar), $SiF_4$ and $BF_4^-$ (tetrahedral) have all bonds equivalent.
  Answer: (D)
C A 16: |-
  Concept: Allotropes of sulphur: rhombic (α) and monoclinic (β).
  Solution:
  1. Rhombic and monoclinic sulphur interconvert reversibly around 369 K on slow heating/cooling (enantiotropy). Statement I is true.
  2. At room temperature the stable form is rhombic (α) sulphur, not monoclinic. Statement II is false.
  Answer: (B)
C A 17: |-
  Concept: Nitration of aniline in strongly acidic mixture.
  Solution:
  1. Part of the aniline is protonated to anilinium ion ($-NH_3^+$, meta-directing), so a substantial amount of m-nitroaniline (about 47%) forms.
  2. The free amine still directs o/p, and p-nitroaniline (about 51%) is the major product.
  3. So the reaction is possible and (A), the para product, is major. Option (C) is wrong because the meta product does form.
  Answer: (A)
C A 18: |-
  Concept: Lassaigne's test for halogens.
  Solution:
  1. If the compound also contains N or S, the sodium extract has $CN^-$/$S^{2-}$, which would give precipitates with $AgNO_3$ and interfere.
  2. Boiling with dilute $HNO_3$ destroys them ($NaCN + HNO_3 \rightarrow HCN\uparrow$, $Na_2S \rightarrow H_2S\uparrow$) before adding $AgNO_3$.
  Answer: (A)
C A 19: |-
  Concept: Normal rain is slightly acidic because of dissolved $CO_2$.
  Solution:
  1. $CO_2 + H_2O \rightleftharpoons H_2CO_3$ gives rain water a pH of about 5.6, so Statement I is true.
  2. Rain with pH below 5.6 (due to $SO_2$, $NO_x$) is called acid rain, so Statement II is true.
  Answer: (B)
C A 20: |-
  Concept: $Ca(OH)_2 \rightleftharpoons Ca^{2+} + 2OH^-$ gives $K_{sp} = s(2s)^2 = 4s^3$.
  Solution:
  1. $s^3 = \frac{5.5\times10^{-6}}{4} = 1.375\times10^{-6}$.
  2. $s = 1.11\times10^{-2}$ M.
  Answer: (D)
C B 1: |-
  Concept: $\Delta T_b = iK_bm$, with $i = 1 + \alpha$ for AB → A⁺ + B⁻.
  Solution:
  1. i = 1 + 0.75 = 1.75.
  2. $m = \frac{2.5}{1.75\times0.52} = 2.75 \approx 3$ molal.
  Answer: 3
C B 2: |-
  Concept: Spin-only moment $\mu = \sqrt{n(n + 2)}$ BM.
  Solution:
  1. Z = 29 is Cu; $Cu^{2+}$ is $3d^9$, with 1 unpaired electron.
  2. $\mu = \sqrt{3} = 1.73$ BM, which rounds to 2.
  Answer: 2
C B 3: |-
  Concept: Identify the functional groups.
  Solution:
  1. Sulphanilic acid: $-SO_3H$ and $-NH_2$, no –COOH.
  2. Picric acid: 2,4,6-trinitrophenol, phenolic OH, no –COOH.
  3. Aspirin (acetylsalicylic acid): has –COOH.
  4. Ascorbic acid (vitamin C): acidic enolic OH in a lactone ring, no –COOH.
  5. Count = 1.
  Answer: 1
C B 4: |-
  Concept: Density of a cubic unit cell: $\rho = \frac{ZM}{N_Aa^3}$.
  Solution:
  1. fcc: Z = 4, $a = 3.596\times10^{-10}$ m, so $a^3 = 4.650\times10^{-29}$ m³.
  2. $\rho = \frac{4\times63.54\times10^{-3}}{6.022\times10^{23}\times4.650\times10^{-29}} \approx 9.077\times10^3$ kg/m³.
  Answer: 9077
C B 5: |-
  Concept: Titration: $M_1V_1n_1 = M_2V_2n_2$; use the concordant reading.
  Solution:
  1. Concordant volume of NaOH = 4.4 mL (it appears three times).
  2. Oxalic acid is dibasic: $1.25\times10.0\times2 = M\times4.4\times1$.
  3. $M = \frac{25}{4.4} = 5.68 \approx 6$ M.
  Answer: 6
C B 6: |-
  Concept: Ionisation energy per mole $= N_A\frac{hc}{\lambda}$.
  Solution:
  1. $E = \frac{6.63\times10^{-34}\times3\times10^8}{663\times10^{-9}} = 3.0\times10^{-19}$ J per atom.
  2. Per mole: $3.0\times10^{-19}\times6.02\times10^{23} = 1.806\times10^5$ J ≈ 180 kJ/mol.
  Answer: 180
C B 7: |-
  Concept: Arrhenius equation, $\ln\frac{k_2}{k_1} = \frac{E_a}{R}\left(\frac{1}{T_1} - \frac{1}{T_2}\right)$.
  Solution:
  1. $\ln5 = \frac{E_a}{8.314}\left(\frac{1}{300} - \frac{1}{325}\right) = \frac{E_a}{8.314}\cdot\frac{25}{97500}$.
  2. $E_a = \frac{1.609\times8.314\times97500}{25} \approx 52.2$ kJ/mol.
  Answer: 52
C B 8: |-
  Concept: Equal "tendency" means equal electrode potentials for the two reductions; use the Nernst equation with $[H^+] = [NO_3^-] = C$ (from $HNO_3$) and equal gas pressures.
  Solution:
  1. $NO_3^- + 4H^+ + 3e^- \rightarrow NO + 2H_2O$: $E_1 = 0.96 + \frac{0.059}{3}\log C^5$.
  2. $NO_3^- + 2H^+ + e^- \rightarrow NO_2 + H_2O$: $E_2 = 0.79 + 0.059\log C^3$.
  3. $E_1 = E_2$: $0.17 = 0.059\left(3 - \frac{5}{3}\right)\log C = 0.0787\log C \Rightarrow \log C \approx 2.16$.
  4. x = 2.16, so 2x ≈ 4.32 ≈ 4.
  Note: the printed "Ans. 1" is a misprint; its own solution ends at 2x ≈ 4, the NTA answer.
  Answer: 4
C B 9: |-
  Concept: Isothermal ideal gas: ΔU = 0, so q = –w; against a constant external pressure, $w = -P_{ext}\Delta V$.
  Solution:
  1. nRT = 5 × 8.314 × 293 = 12180 J; $V_1 = \frac{12180}{2.1\times10^6} = 5.80\times10^{-3}$ m³ and $V_2 = \frac{12180}{1.3\times10^6} = 9.37\times10^{-3}$ m³.
  2. $q = P_{ext}(V_2 - V_1) = 4.3\times10^6\times3.57\times10^{-3} \approx 15.3\times10^3$ J ≈ 15 kJ.
  (The data are as printed; physically, expansion against a higher external pressure is not possible, but the official answer follows this formula.)
  Answer: 15
C B 10: |-
  Concept: Photoelectric cells need a metal with a very low ionisation enthalpy / work function, so visible light can eject electrons.
  Solution:
  1. Caesium has the lowest ionisation enthalpy of the group and is used in photoelectric cells.
  2. Li, Na and Rb are not used for this purpose, so the number is 1.
  Answer: 1
