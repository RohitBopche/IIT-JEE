    In the light of the above statements, choose the most appropriate answer from the options given below:
  o: ['Statement-I is false but Statement-II is true', 'Statement-I is true but Statement-II is false', 'Both Statement-I and Statement-II are false', 'Both Statement-I and Statement-II are true.']
  a: D
