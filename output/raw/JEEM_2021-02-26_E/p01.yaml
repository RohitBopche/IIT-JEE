  q: |-
    A tuning fork A of unknown frequency produces 5beats/s with a fork of known frequency 340 HZ. When fork A filed, the beat frequency decreases to 2beats/s. What is the frequency of fork A?
  o: ['342 Hz', '335 Hz', '338 Hz', '345 Hz']
