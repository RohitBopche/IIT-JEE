P A 1: |-
  Concept: $K = \sqrt{I/M}$; for a disc, $I_z = \frac{MR^2}{2}$ and $I_x = I_y = \frac{MR^2}{4}$ (perpendicular axis theorem).
  Solution:
  1. $K_x = K_y = \frac{R}{2}$ but $K_z = \frac{R}{\sqrt2}$, so the radii of gyration are not all equal: A is false.
  2. R (a rigid body has fixed mass and shape) is a true statement.
  Answer: (D)
P A 2: |-
  Concept: Triangle law: $\vec P = \vec Q + \vec R$ means Q and R are drawn head-to-tail and P closes the triangle from the tail of Q to the head of R.
  Solution:
  1. (a) $\vec C = \vec A + \vec B$: C is the closing side (iv).
  2. (b) $\vec A = \vec B + \vec C$: A is the closing side (iii).
  3. (c) $\vec B = \vec A + \vec C$: B is the closing side (i).
  4. (d) $\vec A + \vec B + \vec C = 0$: the three vectors form a closed cycle (ii).
  Answer: (B)
P A 3: |-
  Concept: $\beta = \frac{\lambda D}{d}$ is largest for the smallest d.
  Solution:
  1. $d_{min} = d_0 - a_0$ and $d_{max} = d_0 + a_0$.
  2. $\Delta\beta = \lambda D\left(\frac{1}{d_0 - a_0} - \frac{1}{d_0 + a_0}\right) = \frac{2\lambda Da_0}{d_0^2 - a_0^2}$.
  Answer: (C)
P A 4: |-
  Concept: Angular momentum conservation at the apsides: $v_{max}x_1 = v_{min}x_2$.
  Solution:
  1. $v_{max} = \frac{v_0x_2}{x_1}$.
  Answer: (C)
P A 5: |-
  Concept: $N = N_0e^{-\lambda t}$.
  Solution:
  1. Quarter decayed: $\frac{3}{4} = e^{-\lambda t_1} \Rightarrow t_1 = \frac{\ln(4/3)}{\lambda}$. Half decayed: $t_2 = \frac{\ln2}{\lambda}$.
  2. $t_2 - t_1 = \frac{1}{\lambda}\ln\frac{2\times3}{4} = \frac{\ln(3/2)}{\lambda}$.
  Answer: (A)
P A 6: |-
  Concept: Total internal reflection when the angle of incidence exceeds the critical angle.
  Solution:
  1. $\sin C = \frac{1}{2.42} = 0.413 \Rightarrow C \approx 24.4°$.
  2. $30° > C$, so the ray is totally reflected and refraction is not possible.
  Answer: (D)
P A 7: |-
  Concept: $\lambda = \frac{h}{\sqrt{2mK}} \propto \frac{1}{\sqrt m}$ at the same K.
  Solution:
  1. $m_e < m_p < m_\alpha \Rightarrow \lambda_e > \lambda_p > \lambda_\alpha$.
  Answer: (D)
P A 8: |-
  Concept: Free fall of successive drops separated by a time interval τ.
  Solution:
  1. After 4 s, the drop has fallen $\frac{1}{2}(9.8)(16) = 78.4$ m.
  2. The next drop has fallen $78.4 - 34.3 = 44.1$ m $= \frac{1}{2}(9.8)(4 - \tau)^2 \Rightarrow 4 - \tau = 3$.
  3. $\tau = 1$ s, i.e. 1 drop per second.
  Answer: (C)
P A 9: |-
  Concept: Impulse along x = change in the normal component of momentum.
  Solution:
  1. Ball (a) (normal incidence): $2mv$. Ball (b) (at 45°): $2mv\cos45°$.
  2. Ratio $= 1 : \frac{1}{\sqrt2} = \sqrt2 : 1$.
  Answer: (A)
P A 10: |-
  Concept: Same heating rate and mass: $c \propto \frac{1}{dT/dt}$.
  Solution:
  1. Slopes: A = $\frac{120}{3} = 40$ °C/s; B = $\frac{90}{6} = 15$ °C/s.
  2. $\frac{c_A}{c_B} = \frac{15}{40} = \frac{3}{8}$.
  Answer: (A)
P A 11: |-
  Concept: Reflection from a perfect reflector reverses the propagation direction; no wave is transmitted.
  Solution:
  1. The reflected wave travels along −z: $3.1\cos[1.8z + 5.4\times10^6t]\hat i$ (up to phase).
  2. $f = \frac{5.4\times10^6}{2\pi} \approx 8.6\times10^5$ Hz and $\lambda = \frac{2\pi}{1.8} \approx 3.5$ m, so (A) and (D) are wrong.
  Answer: (C)
P A 12: |-
  Concept: The maximum measurable emf equals the potential drop across the whole wire.
  Solution:
  1. Wire resistance $= 1000\text{ cm}\times0.1\ \Omega/\text{cm} = 100\ \Omega$.
  2. $I = \frac{6}{100 + 20} = 0.05$ A, so $V_{AB} = 0.05\times100 = 5$ V.
  Answer: (C)
P A 13: |-
  Concept: Adiabatic: $TV^{\gamma - 1}$ = constant, with $V \propto l$ and $\gamma = \frac{5}{3}$.
  Solution:
  1. $\frac{T_1}{T_2} = \left(\frac{l_2}{l_1}\right)^{2/3}$.
  Answer: (D)
P A 14: |-
  Concept: $C_P - C_V = R$ holds for ideal behaviour, which real gases approach at higher temperature.
  Solution:
  1. State P obeys the ideal relation, while Q deviates, so P is at the higher temperature: $T_P > T_Q$.
  Answer: (C)
P A 15: |-
  Concept: AM bandwidth $= 2f_m$.
  Solution:
  1. $f_m = 10^5$ Hz, so the bandwidth is $2\times10^5$ Hz = 200 kHz.
  Answer: (A)
P A 16: |-
  Concept: In series, the same stress acts on both wires and the extensions add.
  Solution:
  1. $\frac{2L}{Y} = \frac{L}{Y_1} + \frac{L}{Y_2} \Rightarrow Y = \frac{2Y_1Y_2}{Y_1 + Y_2}$.
  Answer: (D)
P A 17: |-
  Concept: Series layers: $\frac{1}{C} = \int\frac{dx}{\varepsilon(x)A}$.
  Solution:
  1. By symmetry, $\frac{1}{C} = \frac{2}{A}\int_0^{d/2}\frac{dx}{\varepsilon_0 + kx} = \frac{2}{kA}\ln\frac{2\varepsilon_0 + kd}{2\varepsilon_0}$.
  2. $C = \frac{kA}{2\ln\left(\frac{2\varepsilon_0 + kd}{2\varepsilon_0}\right)}$.
  Answer: (C)
P A 18: |-
  Concept: $A = \lambda N$ with $\lambda = \frac{0.693}{T_{1/2}}$.
  Solution:
  1. $N = \frac{2\times10^{-3}}{198}\times6.02\times10^{23} = 6.08\times10^{18}$.
  2. $\lambda = \frac{0.693}{3\times86400} = 2.67\times10^{-6}$ s⁻¹.
  3. $A \approx 1.62\times10^{13} = 16.2\times10^{12}$ s⁻¹.
  Answer: (C)
P A 19: |-
  Concept: Momentum conservation gives the fragments equal and opposite momenta, and $\lambda = \frac{h}{p}$.
  Solution:
  1. Equal |p| means equal wavelengths: 1 : 1.
  Answer: (B)
P A 20: |-
  Concept: NAND with tied inputs = NOT; De Morgan: $\overline{\bar A + \bar B} = AB$.
  Solution:
  1. Inverted inputs fed to a NOR give $Y = \overline{\bar A + \bar B} = A\cdot B$, an AND gate.
  Answer: (C)
P B 1: |-
  Concept: $L_z = m(xv_y - yv_x)$.
  Solution:
  1. $x = 10\alpha t^2$, $v_x = 20\alpha t$; $y = 5\beta(t - 5)$, $v_y = 5\beta$.
  2. $L_z = 50m\alpha\beta(t^2 - 2t^2 + 10t) = 50m\alpha\beta(10t - t^2)$.
  3. $L(0) = 0$; it is zero again at $t = 10$ s.
  Answer: 10
P B 2: |-
  Concept: Two-body oscillator: $\omega = \sqrt{\frac{k_{eq}}{\mu}}$.
  Solution:
  1. Springs in series: $k_{eq} = \frac{k\cdot4k}{5k} = \frac{4k}{5} = 16$ N/m.
  2. $\mu = \frac{0.2\times0.8}{1.0} = 0.16$ kg.
  3. $\omega = \sqrt{\frac{16}{0.16}} = 10$ rad/s.
  Answer: 10
P B 3: |-
  Concept: Linearise the net Coulomb force for small x.
  Solution:
  1. $F = kq^2\left[\frac{1}{(1 - x)^2} - \frac{1}{(1 + x)^2}\right] \approx 4kq^2x$ (with half-separation 1 m).
  2. $\omega = \sqrt{\frac{4kq^2}{m}} = \sqrt{\frac{4\times9\times10^9\times10}{10^{-6}}} = 6\times10^8 = 6000\times10^5$ rad/s.
  Answer: 6000
P B 4: |-
  Concept: Current decay in LR: $i = i_0e^{-t/\tau}$ with $\tau = \frac{L}{R}$.
  Solution:
  1. $i_0 = \frac{20}{10^4} = 2$ mA and $\tau = \frac{10^{-2}}{10^4} = 10^{-6}$ s.
  2. After 1 μs: $i = 2\times0.37 = 0.74$ mA $= \frac{74}{100}$ mA.
  Answer: 74
P B 5: |-
  Concept: Energy conservation for a pendulum.
  Solution:
  1. $v^2 = u^2 - 2gl(1 - \cos60°) = 9 - 2\times10\times0.5\times0.5 = 4$.
  2. $v = 2$ m/s.
  Answer: 2
P B 6: |-
  Concept: 1D elastic collision: $v_1 = \frac{m_1 - m_2}{m_1 + m_2}u$.
  Solution:
  1. $\frac{2 - m_2}{2 + m_2} = \frac{1}{4} \Rightarrow m_2 = 1.2$ kg.
  2. $v_{cm} = \frac{2\times4}{3.2} = 2.5$ m/s, so $x = 25$.
  Answer: 25
P B 7: |-
  Concept: The bulb must get its rated current.
  Solution:
  1. $R_b = \frac{100^2}{200} = 50\ \Omega$ and $I = 2$ A.
  2. The series R must drop 100 V: $R = \frac{100}{2} = 50\ \Omega$.
  Answer: 50
P B 8: |-
  Concept: Observed reading = true value + zero error; least count 0.001 cm.
  Solution:
  1. Gauge A: +5 divisions (+0.005 cm), so it reads 0.327 cm, i.e. circular scale 27.
  2. Gauge B: reference at 92, a −8 division error (−0.008 cm), so it reads 0.314 cm, i.e. circular scale 14.
  3. Difference $= 27 - 14 = 13$.
  Answer: 13
P B 9: |-
  Concept: $B = \mu_0(1 + \chi)nI$, so the fractional increase is χ.
  Solution:
  1. Percentage increase $= 2.2\times10^{-5}\times100 = 2.2\times10^{-3}\% = \frac{22}{10^4}$.
  Answer: 22
P B 10: |-
  Concept: Faraday's law with $P = \frac{\varepsilon^2}{R}$.
  Solution:
  1. $\phi = B\pi r^2 = 4\times10^{-3}\left(1 - \frac{t}{100}\right)$, so $\varepsilon = 4\times10^{-5}$ V (constant).
  2. $P = \frac{(4\times10^{-5})^2}{2\times10^{-6}} = 8\times10^{-4}$ W for 100 s.
  3. $E = 0.08$ J $= 80$ mJ.
  Answer: 80
