  t: S
  st: AR
  q: |-
    Given below are two statements : one is labelled as Assertion A and the other is labelled as Reason R.
    Assertion A : Moment of inertia of a circular disc 'M' and radius 'R' about X, Y axes (passing through its plane) and Z-axis which is perpendicular to its plane were found to be $I_x$, $I_y$ & $I_z$ respectively. The respective radii of gyration about all the three axes will be the same.
    Reason R : A rigid body making rotational motion has fixed mass and shape.
    In the light of the above statements, choose the most appropriate answer from the options given below :
  o: ['A is correct but R is not correct .', 'Both A and B are correct and R is the correct explanation of A .', 'Both A and R are correct but R is NOT the correct explanation of A.', 'A is not correct but R is correct.']
  ch: Rotational Motion
  tp: Radius of gyration
  df: M
