C A 1: |-
  Concept: Phenol is highly activated; without moderation, bromine water gives 2,4,6-tribromophenol.
  Solution:
  1. Monobromination (p-bromophenol) needs milder conditions: Br₂ in a non-polar solvent (CS₂ or CHCl₃) at low temperature.
  2. The key also counts Br₂/FeBr₃ as giving the p-product.
  3. Bromine water gives the tribromo product, so (a) is excluded.
  Answer: (B)
C A 2: |-
  Concept: Cross-aldol at the only enolisable α-carbon, then the iodoform reaction on a CH₃CH(OH)– group.
  Solution:
  1. The ketone enolate (at C-5, since C-2 has no H) adds to CH₃CHO, giving P = 5-(1-hydroxyethyl)-2,2-dimethylcyclopentanone.
  2. I₂/NaOH oxidises CH₃CH(OH)R to CH₃COR and then cleaves off CHI₃ (filtered off), leaving RCOO⁻.
  3. Acidifying the filtrate gives X = 3,3-dimethyl-2-oxocyclopentane-1-carboxylic acid.
  Answer: (C)
C A 3: |-
  Concept: Gabriel synthesis is SN2 by the phthalimide anion.
  Solution:
  1. Aryl halides do not undergo SN2 with the phthalimide anion, so aromatic 1° amines cannot be made this way.
  2. Both A and R are true, and R is the reason.
  Answer: (A)
C A 4: |-
  Concept: Zero-point energy is lower for the heavier isotope, so the D–D bond is slightly stronger.
  Solution:
  1. $E_{H-H} = 435.9$ kJ/mol and $E_{D-D} = 443.4$ kJ/mol, so $E_H \approx E_D - 7.5$.
  Answer: (D)
C A 5: |-
  Concept: Oxidative cleavage of alkenes.
  Solution:
  1. 2-Methylpropene, (CH₃)₂C=CH₂: KMnO₄/H⁺ gives acetone (C₃H₆O) + CO₂; ozonolysis gives acetone + HCHO.
  2. B = acetone in both cases.
  Answer: (A)
C A 6: |-
  Concept: Si is too small to accommodate six large Cl atoms.
  Solution:
  1. [SiCl₆]²⁻ is not known, while [SiF₆]²⁻, [GeCl₆]²⁻ and [Sn(OH)₆]²⁻ exist.
  Answer: (D)
C A 7: |-
  Concept: Grignard 1,2-addition to an enone, then acid work-up.
  Solution:
  1. C₂H₅MgBr adds to C=O, giving CH₂=CH–C(OH)(CH₃)C₂H₅ after hydrolysis.
  2. In aqueous HCl, H–Cl adds across the vinyl group (Markovnikov), giving CH₃–CHCl–C(OH)(CH₃)–CH₂CH₃, which is structure (A) per the official key.
  Answer: (A)
C A 8: |-
  Concept: Leaching of bauxite (Baeyer's process) with conc. NaOH.
  Solution:
  1. Al₂O₃ dissolves as sodium aluminate, and the acidic silica impurity also reacts with NaOH (forming sodium silicate).
  2. Fe₂O₃ and TiO₂ are left as insoluble residues.
  Answer: (C)
C A 9: |-
  Concept: Phenol–formaldehyde polymers.
  Solution:
  1. The repeat unit, phenol rings linked by –CH₂– at the ortho positions, is novolac (the linear precursor of Bakelite).
  Answer: (B)
C A 10: |-
  Concept: Isoelectronic ions shrink with increasing charge; K⁺ has an extra shell.
  Solution:
  1. Al³⁺ < Mg²⁺ < Na⁺ (all 10 e⁻), and K⁺ is the largest.
  Answer: (C)
C A 11: |-
  Concept: Globular versus fibrous proteins.
  Solution:
  1. Albumin is globular and water-soluble.
  2. Myosin, collagen and fibrin are fibrous and insoluble.
  Answer: (D)
C A 12: |-
  Concept: A paramagnetic species (with unpaired electrons) responds to a magnetic field.
  Solution:
  1. [Fe(H₂O)₆]³⁺: Fe³⁺ d⁵ high spin, 5 unpaired electrons.
  2. [Co(CN)₆]³⁻ (low-spin d⁶), [Ni(CN)₄]²⁻ (square planar d⁸) and Ni(CO)₄ (d¹⁰) are diamagnetic.
  Answer: (D)
C A 13: |-
  Concept: Only acids stronger than H₂CO₃ liberate CO₂ from NaHCO₃.
  Solution:
  1. (CH₃)₃NH⁺Cl⁻ (the salt of a weak base with HCl) is acidic, so it liberates CO₂.
  2. The others are basic or neutral.
  Answer: (C)
C A 14: |-
  Concept: Valid resonance structures come from moving π/lone-pair electrons through a conjugated system without moving atoms.
  Solution:
  1. In (B), the charge separation is placed on a carbon that is not conjugated with the nitro group (an sp³ link intervenes), so it cannot arise by electron delocalisation.
  2. So (B) is not a correct resonating structure.
  Answer: (B)
C A 15: |-
  Concept: Oxidation numbers of the metals.
  Solution:
  1. CrO₃ +6 > V₂O₅ +5 > MnO₂ +4 > Fe₂O₃ +3 > Cu₂O +1.
  Answer: (A)
C A 16: |-
  Concept: Micelle structure: hydrophobic tails cluster together, and the ionic heads face the polar medium.
  Solution:
  1. The key takes the normal (aqueous) micelle: spherical, with the CH₃(CH₂)₁₆– tails pointing towards the centre and –COO⁻ on the surface.
  2. (Strictly, in oil a reverse micelle forms with tails outward; the key answer corresponds to the usual NCERT picture.)
  Answer: (C)
C A 17: |-
  Concept: Graphical signatures of reaction order.
  Solution:
  1. Zero order: constant rate (a) and $t_{1/2} \propto [A]_0$ (b).
  2. First order: exponential decay of concentration (c) and rate ∝ [A] (e).
  Answer: (C)
C A 18: |-
  Concept: Green chemistry in dry cleaning (NCERT).
  Solution:
  1. Tetrachloroethene (Cl₂C=CCl₂), the traditional solvent, is being replaced because it is a suspected carcinogen and pollutes groundwater, so it is "not being used" (official key).
  2. Liquid CO₂ with a detergent is used for dry cleaning, and H₂O₂ is used for bleaching.
  Answer: (B)
C A 19: |-
  Concept: Hinsberg's reagent reacts with 1° and 2° amines.
  Solution:
  1. (A) H₂/Ni, (B) LiAlH₄ and (C) Na(Hg)/C₂H₅OH (Mendius) reduce –CN to –CH₂NH₂ (1° amines), which form sulphonamides.
  2. (D) SnCl₂/HCl (Stephen reduction) gives benzaldehyde, not an amine, so there is no reaction.
  Answer: (D)
C A 20: |-
  Concept: Properties of alkaline-earth hydroxides.
  Solution:
  1. Be(OH)₂ is amphoteric and dissolves in NaOH ([Be(OH)₄]²⁻), so I is incorrect.
  2. Solubility of the hydroxides increases down the group, so II is correct.
  Answer: (B)
C B 1: |-
  Concept: Every single bond is σ; each multiple bond contains one σ.
  Solution:
  1. C–H: 3 + 1 + 1 + 1 = 6. C–C links: 4 (single, double, single, triple), each with one σ.
  2. Total $= 10$.
  Answer: 10
C B 2: |-
  Concept: Hess's law: $\Delta_{sub}H = \Delta_{fus}H + \Delta_{vap}H$.
  Solution:
  1. $2.8 + 98.2 = 101$ kJ mol⁻¹.
  Answer: 101
C B 3: |-
  Concept: $C_4H_{10} + \frac{13}{2}O_2 \to 4CO_2 + 5H_2O$.
  Solution:
  1. 72 g H₂O = 4 mol, so butane $= \frac{4}{5} = 0.8$ mol.
  2. Mass $= 0.8\times58 = 46.4$ g $= 464\times10^{-1}$ g.
  Answer: 464
C B 4: |-
  Concept: Henry's law: $x = \frac{p}{K_H}$.
  Solution:
  1. $x = \frac{0.835}{1670} = 5\times10^{-4}$.
  2. 0.9 L water = 50 mol, so CO₂ $= 5\times10^{-4}\times50 = 0.025$ mol = 25 mmol.
  Answer: 25
C B 5: |-
  Concept: $Cr_2O_7^{2-}$ accepts 6 e⁻; Fe²⁺ gives 1 e⁻.
  Solution:
  1. $15\times0.02\times6 = 1.8$ mmol of Fe²⁺.
  2. $M = \frac{1.8}{10} = 0.18$ M $= 18\times10^{-2}$ M.
  Answer: 18
C B 6: |-
  Concept: Nernst equation for $Zn + 2Fe^{3+} \to Zn^{2+} + 2Fe^{2+}$.
  Solution:
  1. $E^\circ = 0.77 + 0.76 = 1.53$ V; $E = 1.53 - 0.059\log\frac{[Fe^{2+}]}{[Fe^{3+}]} = 1.500$.
  2. $\log\frac{[Fe^{2+}]}{[Fe^{3+}]} = 0.508 \Rightarrow$ ratio $= 3.22$.
  3. Fraction of Fe³⁺ $= \frac{1}{4.22} = 0.237 \approx 24\times10^{-2}$.
  Answer: 24
C B 7: |-
  Concept: Q = 1 < K, so the reaction moves forward.
  Solution:
  1. $\frac{(1 + 2x)^2}{(1 - x)^2} = 100 \Rightarrow \frac{1 + 2x}{1 - x} = 10 \Rightarrow x = 0.75$.
  2. $[C] = 2.5$ M $= 25\times10^{-1}$ M.
  Answer: 25
C B 8: |-
  Concept: Photons per second = power ÷ photon energy (one electron per photon).
  Solution:
  1. $E_{photon} = \frac{6.626\times10^{-34}\times3\times10^8}{400\times10^{-9}} = 4.97\times10^{-19}$ J; power = 100 W.
  2. Electrons per second $= \frac{100}{4.97\times10^{-19}} = 2.0\times10^{20}$.
  Answer: 2
C B 9: |-
  Concept: $n = \frac{PV}{RT}$.
  Solution:
  1. $n = \frac{1\times4\times10^6\text{ L}}{0.083\times300} = 1.61\times10^5$ mol.
  2. Mass $= 1.61\times10^5\times16 = 25.7\times10^5$ g ≈ $26\times10^5$ g.
  Answer: 26
C B 10: |-
  Concept: Ionisable chlorides precipitate as AgCl; coordinated ones do not.
  Solution:
  1. All 3 Cl⁻ precipitate, so the complex is [Cr(NH₃)₃(H₂O)₃]Cl₃.
  2. No chloride is in the coordination sphere: 0.
  Answer: 0
