  Why others are wrong:
  - (A) $2a = b + c$, (C) $a = b + 2c$, (D) $3c = a + b$ do not match the determinant condition; e.g. a = 0, b = 1, c = 2 satisfies (B) and makes the vectors coplanar, but fails (A) and (D).
