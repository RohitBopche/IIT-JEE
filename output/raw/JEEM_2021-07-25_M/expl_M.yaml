  1. (D) Define f(k) = n + 1 for every k in the n-th block $\{3n + 1, 3n + 2, 3n + 3\}$. Since g keeps each element in its own block, $f(g(k)) = f(k)$, i.e. fog = f. Every natural number n + 1 is hit, so f is onto. TRUE.
