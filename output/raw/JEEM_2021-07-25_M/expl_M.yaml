M B 4: |-
  Concept: Substitute $u = e^y$ (so $u' = e^yy'$) to get a linear first-order equation, and solve with an integrating factor.
  Solution:
  1. $u' - 2u\sin x = -\sin x\cos^2x$.
  2. Integrating factor: $e^{\int-2\sin x\,dx} = e^{2\cos x}$.
  3. $\frac{d}{dx}(ue^{2\cos x}) = -\sin x\cos^2x\,e^{2\cos x}$. With $c = \cos x$, $dc = -\sin x\,dx$: RHS integral $= \int c^2e^{2c}dc = e^{2c}\left(\frac{c^2}{2} - \frac{c}{2} + \frac{1}{4}\right)$.
  4. $ue^{2c} = e^{2c}\left(\frac{c^2}{2} - \frac{c}{2} + \frac{1}{4}\right) + K$.
  5. $y\left(\frac{\pi}{2}\right) = 0$: c = 0, u = 1 → $1 = \frac{1}{4} + K \Rightarrow K = \frac{3}{4}$.
  6. At x = 0 (c = 1): $u = \frac{1}{4} + \frac{3}{4}e^{-2}$, so $y(0) = \ln\left(\frac{1}{4} + \frac{3}{4}e^{-2}\right)$.
  7. $\alpha = \frac{1}{4}$, $\beta = \frac{3}{4}$, and $4(\alpha + \beta) = 4$.
  Answer: 4
