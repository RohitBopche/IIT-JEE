M A 13: |-
  Concept: If g is bounded and integrable, $F(x) = \int_0^xg(y)\,dy$ is continuous. By the fundamental theorem of calculus, $F'(x) = g(x)$ at every point where g is continuous.
  Solution:
  1. $g(y) = [y]$ is bounded on every finite interval, so f is continuous everywhere on [0, ∞).
  2. For non-integer x, [x] is continuous there, so f is differentiable with $f'(x) = [x]$.
  3. At an integer x = n ≥ 1: left derivative = n − 1 and right derivative = n. They differ, so f is not differentiable at integers. (At x = 0 only the right derivative exists, equal to 0.)
  4. Explicitly, f is piecewise linear: on [n, n + 1], $f(x) = \frac{n(n - 1)}{2} + n(x - n)$ — a broken line with corners at integers.
  Why others are wrong:
  - (A) says differentiable everywhere, but slopes jump at integers.
  - (B) says discontinuous at integers — integrals are continuous.
  - (D) says f fails to be continuous at integers too.
  Answer: (C)
M A 14: |-
  Concept: Three vectors are coplanar iff their scalar triple product (the determinant of their components) is zero. Row operations simplify the determinant.
  Solution:
  1. Rows: $R_1 = (2 + a + b,\ a + 2b + c,\ -(b + c))$, $R_2 = (1 + b,\ 2b,\ -b)$, $R_3 = (2 + b,\ 2b,\ 1 - b)$.
  2. $R_1 \to R_1 - R_2 = (1 + a,\ a + c,\ -c)$ and $R_3 \to R_3 - R_2 = (1, 0, 1)$.
