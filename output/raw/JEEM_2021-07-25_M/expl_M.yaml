  Concept: Simplify each fraction with algebraic identities before expanding: $x + 1 = (x^{1/3})^3 + 1 = (x^{1/3} + 1)(x^{2/3} - x^{1/3} + 1)$ and $x - 1 = (\sqrt x - 1)(\sqrt x + 1)$.
