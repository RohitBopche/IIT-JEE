M A 19: |-
  Concept: For small $\frac{b}{a}$: $\frac{1}{a - kb} = \frac{1}{a}\left(1 - \frac{kb}{a}\right)^{-1} = \frac{1}{a}\left(1 + \frac{kb}{a} + \frac{k^2b^2}{a^2} + \dots\right)$, neglecting cubes and higher powers.
