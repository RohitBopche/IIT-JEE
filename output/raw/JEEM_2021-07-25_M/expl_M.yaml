M A 1: |-
  Concept: Area between two curves.
  Solution:
  1. $2x^2 = 4 - 2x \Rightarrow x = 1$ (for $x \ge 0$).
  2. Area $= \int_0^1(4 - 2x - 2x^2)dx = 4 - 1 - \frac{2}{3} = \frac{7}{3}$.
  Answer: (C)
M A 2: |-
  Concept: Each ball independently goes to $B_3$ with probability $\frac{1}{4}$.
  Solution:
  1. $P = \binom{9}{3}\left(\frac{1}{4}\right)^3\left(\frac{3}{4}\right)^6 = k\left(\frac{3}{4}\right)^9 \Rightarrow k = \frac{84}{27} = \frac{28}{9} \approx 3.11$.
  2. $|k - 3| < 1$.
  Answer: (C)
M A 3: |-
  Concept: Put $t = e^x > 0$ and count the positive roots.
  Solution:
  1. $t^6 - t^4 - 2t^3 - 12t^2 + t + 1 = 0$ has exactly two positive roots (≈ 0.32 and ≈ 2.11; the others are negative or complex).
  2. So there are 2 real x.
  Answer: (C)
M A 4: |-
  Concept: No solution means $\Delta = 0$ with inconsistent equations.
  Solution:
  1. $\Delta = 3 - a = 0 \Rightarrow a = 3$.
  2. With $a = 3$, $R_3 = R_1 + R_2$ on the left, so we need $b = 8 + 5 = 13$ for consistency.
  3. No solution when $a = 3$ and $b \ne 13$.
  Answer: (C)
M A 5: |-
  Concept: Match the one-sided limits with f(2).
  Solution:
  1. For $x < 2$: $|(x-2)(x-3)| = (x-2)(x-3)$ and $5x - x^2 - 6 = -(x-2)(x-3)$, so $f = -\frac{\lambda}{\mu}$.
  2. For $x \to 2^+$: $\{x\} = x - 2$, so $\frac{\tan(x-2)}{x-2} \to 1$ and $f \to e$.
  3. $\mu = e$ and $-\frac{\lambda}{e} = e \Rightarrow \lambda = -e^2$, so $\lambda + \mu = e(1 - e)$.
  Answer: (A)
M A 6: |-
  Concept: Parametrise L as $(t, 0, -t)$ with direction $(1, 0, -1)$.
  Solution:
  1. Foot N: $(1 - t, 2, -1 + t)\cdot(1, 0, -1) = 2 - 2t = 0 \Rightarrow t = 1$, so $N = (1, 0, -1)$ and $\vec{PN} = (0, -2, 0)$.
  2. Q: $(s - 1, -2, 1 - s)\cdot(1, 1, 2) = 0 \Rightarrow s = -1$, so $Q = (-1, 0, 1)$ and $\vec{PQ} = (-2, -2, 2)$.
  3. $\cos\alpha = \frac{4}{2\times2\sqrt3} = \frac{1}{\sqrt3}$.
  Answer: (C)
M A 7: |-
  Concept: Case analysis on p.
  Solution:
  1. If p is true, q must be true, and then $q \Rightarrow \sim p$ fails: false.
  2. If p is false, both implications are true.
  3. So the expression $\equiv \sim p$.
  Answer: (C)
M A 8: |-
  Concept: Find the ellipse, then intersect it with the circle.
  Solution:
  1. $e^2 = \frac{1}{3} \Rightarrow b^2 = \frac{2a^2}{3}$; the point gives $a^2 = 3$, $b^2 = 2$, focus F = (1, 0).
  2. $(x - 1)^2 + 2 - \frac{2x^2}{3} = \frac{4}{3} \Rightarrow x^2 - 6x + 5 = 0 \Rightarrow x = 1$ (x = 5 is outside).
  3. $y^2 = \frac{4}{3}$, so $PQ^2 = \left(2\cdot\frac{2}{\sqrt3}\right)^2 = \frac{16}{3}$.
  Answer: (A)
M A 9: |-
  Concept: The tangent lines from the eye make half-angle 30° with the line to the centre.
  Solution:
  1. Distance to the centre $d = \frac{16}{\sin30°} = 32$ m.
  2. Height of the centre $= 32\sin75° = 8(\sqrt6 + \sqrt2)$; add the radius 16.
  3. Top $= 8(\sqrt6 + \sqrt2 + 2)$ m.
  Answer: (B)
M A 10: |-
  Concept: Parabola with vertex (2, 0) and focus (4, 0): $y^2 = 8(x - 2)$.
  Solution:
  1. Tangent $y = mx$ from O: $m^2x^2 - 8x + 16 = 0$ with zero discriminant gives $m = \pm1$ and $x = 4$.
  2. S, R = (4, ±4); area of ΔSOR $= \frac{1}{2}\times8\times4 = 16$.
  Answer: (C)
M A 11: |-
  Concept: Standardise, find the foci, and substitute the centroid coordinates.
  Solution:
  1. $\frac{(x+1)^2}{9} - \frac{(y-2)^2}{16} = 1$, with foci $(-1 \pm 5, 2)$.
  2. Centroid: $x = 3h + 2$, $y = 3k - 4$.
  3. Substituting: $16h^2 - 9k^2 + 32h + 36k - 36 = 0$.
  Answer: (B)
M A 12: |-
  Concept: Use $S_n = \frac{n}{2}(2a + (n - 1)d)$.
  Solution:
  1. $S_{3n} = 3S_{2n} \Rightarrow 2a = -(n - 1)d$.
  2. $\frac{S_{4n}}{S_{2n}} = \frac{2(2a + (4n - 1)d)}{2a + (2n - 1)d} = \frac{2\cdot3nd}{nd} = 6$.
  Answer: (B)
M A 13: |-
  Concept: An integral of a bounded function is continuous; $f'(x) = [x]$ where [x] is continuous.
  Solution:
  1. f is continuous everywhere.
  2. $[x]$ jumps at the integers, so f has corners there (not differentiable).
  Answer: (C)
M A 14: |-
  Concept: Coplanar means the determinant is zero.
  Solution:
  1. $R_1 - R_2$ and $R_3 - R_2$ reduce the determinant to $\begin{vmatrix}1+a&a+c&-c\\1+b&2b&-b\\1&0&1\end{vmatrix} = 2b - a - c$.
  2. So $2b = a + c$.
  Answer: (B)
M A 15: |-
  Concept: g cyclically permutes each block {3n+1, 3n+2, 3n+3} and has no fixed points.
  Solution:
  1. (A) fails: gof = f would need g to fix values of f. (B) fails: $g^3 = $ identity ≠ g.
  2. (C) fails: fog = f with f one-one forces g = identity.
  3. (D) holds: define $f = n + 1$ on the n-th block; then fog = f and f is onto.
  Answer: (D)
M A 16: |-
  Concept: Sign of $f'(x) = 6\sin x\cos x(2\sin x + 1)(\sin x + 2)$.
  Solution:
  1. On $\left(-\frac{\pi}{6}, 0\right)$: $\sin x \in \left(-\frac{1}{2}, 0\right)$, so $\sin x < 0$ and the other factors are positive; $f' < 0$.
  2. f is decreasing there.
  Answer: (C)
M A 17: |-
  Concept: King's property: $x \to \frac{\pi}{4} - x$ turns $\tan2x$ into $\cot2x$.
  Solution:
  1. $I + I = \int_{\pi/24}^{5\pi/24}1\,dx = \frac{\pi}{6}$.
  2. $I = \frac{\pi}{12}$.
  Answer: (B)
M A 18: |-
  Concept: Sum-to-product: the LHS $= 4\sin\frac{5x}{2}\cos x\cos\frac{x}{2}$.
  Solution:
  1. $\sin\frac{5x}{2} = 0$: $x = 0, \frac{2\pi}{5}, \frac{4\pi}{5}, \frac{6\pi}{5}, \frac{8\pi}{5}, 2\pi$, summing to $6\pi$.
  2. $\cos x = 0$: $\frac{\pi}{2}, \frac{3\pi}{2}$ (sum $2\pi$). $\cos\frac{x}{2} = 0$: $x = \pi$.
  3. Total $= 9\pi$.
  Answer: (B)
M A 19: |-
  Concept: $\frac{1}{a - kb} = \frac{1}{a}\left(1 + \frac{kb}{a} + \frac{k^2b^2}{a^2} + \dots\right)$.
  Solution:
  1. The sum is $\frac{n}{a} + \frac{b}{a^2}\cdot\frac{n(n+1)}{2} + \frac{b^2}{a^3}\cdot\frac{n(n+1)(2n+1)}{6}$.
  2. The $n^3$ coefficient is $\gamma = \frac{b^2}{3a^3}$.
  Answer: (C)
M A 20: |-
  Concept: Substitute $v = y - x$.
  Solution:
  1. $v' = xe^v \Rightarrow -e^{-v} = \frac{x^2}{2} + C$; $v(0) = 0 \Rightarrow C = -1$, so $y = x + \ln\frac{2}{2 - x^2}$.
  2. $y' = 1 + \frac{2x}{2 - x^2} = 0 \Rightarrow x = 1 - \sqrt3$.
  3. $y_{min} = 1 - \sqrt3 + \ln2 - \ln(2\sqrt3 - 2) = (1 - \sqrt3) - \ln(\sqrt3 - 1)$.
  Answer: (C)
M B 1: |-
  Concept: Case-wise selection with the constraints $a \ge 2$, $b \ge 2$, $c \ge 2$ and $a + b \le 5$.
  Solution:
  1. $(a, b, c) \in \{(2, 2, 6), (2, 3, 5), (3, 2, 5)\}$.
  2. $10\cdot15\cdot28 + 10\cdot20\cdot56 + 10\cdot15\cdot56 = 4200 + 11200 + 8400 = 23800$.
  3. $k = 238$.
  Answer: 238
M B 2: |-
  Concept: $\vec r \parallel (\vec p + \vec q)\times(\vec p - \vec q) = -2\,\vec p\times\vec q$.
  Solution:
  1. $\vec p\times\vec q = (1, -1, 1)$; $|\vec r| = \sqrt3 \Rightarrow \vec r = \pm(1, -1, 1)$.
  2. $|\alpha| + |\beta| + |\gamma| = 3$.
  Answer: 3
M B 3: |-
  Concept: Simplify: $\frac{x + 1}{x^{2/3} - x^{1/3} + 1} = x^{1/3} + 1$ and $\frac{x - 1}{x - \sqrt x} = 1 + x^{-1/2}$.
  Solution:
  1. The expression is $(x^{1/3} - x^{-1/2})^{10}$; the constant term needs $\frac{10 - r}{3} = \frac{r}{2} \Rightarrow r = 4$.
  2. $\binom{10}{4} = 210$.
  Answer: 210
M B 4: |-
  Concept: Put $u = e^y$ to get a linear DE; integrating factor $e^{2\cos x}$.
  Solution:
  1. $(ue^{2\cos x})' = -\sin x\cos^2x\,e^{2\cos x}$; with $c = \cos x$: $ue^{2c} = e^{2c}\left(\frac{c^2}{2} - \frac{c}{2} + \frac{1}{4}\right) + K$.
  2. $y(\frac{\pi}{2}) = 0$ ($c = 0$, $u = 1$) gives $K = \frac{3}{4}$.
  3. At $x = 0$: $u = \frac{1}{4} + \frac{3}{4}e^{-2}$, so $4(\alpha + \beta) = 4$.
  Answer: 4
M B 5: |-
  Concept: Count $ad - bc = 15$ with entries in {−3, …, 3}.
  Solution:
  1. We need $ad = 9$, $bc = -6$ or $ad = 6$, $bc = -9$.
  2. $ad = 9$: (3, 3), (−3, −3), i.e. 2 ways; $bc = -6$: (2, −3), (−2, 3), (3, −2), (−3, 2), i.e. 4 ways; 8 combinations.
  3. By symmetry, $ad = 6$, $bc = -9$ gives another 8. Total 16.
  Answer: 16
M B 6: |-
  Concept: $\binom{19}{9} + \binom{19}{10} = \binom{20}{10}$.
  Solution:
  1. The ratio $\frac{\binom{20}{10}}{\binom{19}{9} + \binom{19}{10}} = 1$.
  Answer: 1
M B 7: |-
  Concept: Powers of $M = \begin{pmatrix}0 & i\\ 1 & 0\end{pmatrix}$.
  Solution:
  1. $M^2 = iI$, so $M^8 = I$ and $M^n = I$ iff $8 \mid n$.
  2. Two-digit multiples of 8: 16, 24, …, 96, i.e. 11 numbers.
  Answer: 11
M B 8: |-
  Concept: Grouped median.
  Solution:
  1. $\alpha + \beta = 584 - 194 = 390$; $N/2 = 292$.
  2. $45 = 40 + \frac{292 - (\alpha + 164)}{30}\times10 \Rightarrow \alpha = 113$, $\beta = 277$.
  3. $|\alpha - \beta| = 164$.
  Answer: 164
M B 9: |-
  Concept: α and β satisfy $x^2 = -5\sqrt2x - 10$, so $P_{n+2} + 5\sqrt2P_{n+1} + 10P_n = 0$.
  Solution:
  1. Numerator $= P_{17}(P_{20} + 5\sqrt2P_{19}) = P_{17}(-10P_{18})$.
  2. Denominator $= P_{18}(P_{19} + 5\sqrt2P_{18}) = P_{18}(-10P_{17})$.
  3. The ratio is 1.
  Answer: 1
M B 10: |-
  Concept: Arithmetico-geometric and geometric sums.
  Solution:
  1. Base $= 1 + \sum_{k\ge1}\frac{4k - 2}{3^k} = 1 + 3 - 1 = 3$.
  2. Exponent $= \log_{0.25}\frac{1}{2} = \frac{1}{2}$.
  3. $l = \sqrt3$, so $l^2 = 3$.
  Answer: 3
