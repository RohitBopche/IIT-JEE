M A 15: |-
  Concept: g permutes each block {3n + 1, 3n + 2, 3n + 3} cyclically: 3n+1 → 3n+2 → 3n+3 → 3n+1. So g is a bijection with no fixed points, and $g\circ g\circ g$ = identity.
