C A 1: |-
  Concept: Acetate in acetic acid is a solvolysis (SN1) reaction, so the rate follows the stability of the carbocation.
  Solution:
  1. 3-Chloro-1-methylcyclohexene ionises to an allylic cation whose resonance form is tertiary (at the CH₃-bearing C), so it is the most stable.
  2. Next come the secondary allylic cations: the one with an adjacent CH₃ (hyperconjugation) ranks above the unsubstituted one.
  3. The CH₂Cl compound gives a primary (only weakly allylic) cation, so it reacts slowest.
  4. This is the order in option (1).
  Answer: (A)
C A 2: |-
  Concept: Physisorption is exothermic, so x/m falls as temperature rises; Freundlich curves saturate ($\frac{x}{m} \propto P^{1/n}$).
  Solution:
  1. T₂ < T₁, so the T₂ curve lies above the T₁ curve.
  2. Both curves are concave and levelling off, as in option (4).
  Answer: (D)
C A 3: |-
  Concept: Composition of Portland cement.
  Solution:
  1. Tricalcium silicate (3CaO·SiO₂) is about 51%, the major component.
  2. It is followed by dicalcium silicate (about 26%) and tricalcium aluminate (about 11%).
  Answer: (B)
C A 4: |-
  Concept: Structure of Cr₂O₇²⁻.
  Solution:
  1. Two CrO₄ tetrahedra share one corner O, with a Cr–O–Cr angle of about 126°, so the bond is bent.
  2. Both Cr–O(bridge) bonds are identical, so the bridge is symmetrical.
  Answer: (B)
C A 5: |-
  Concept: Glycosidic linkages in common carbohydrates.
  Solution:
  1. Lactose: β-D-galactose C1 to glucose C4, a β(1→4) link.
  2. Sucrose is α1–β2; maltose and amylose are α(1→4).
  Answer: (A)
C A 6: |-
  Concept: Reduction or hydrolysis of a cyanohydrin.
  Solution:
  1. LiAlH₄ reduces –CN to –CH₂NH₂: A = (CH₃)₂C(OH)CH₂NH₂.
  2. H₃O⁺/H₂SO₄ hydrolyses –CN to –COOH, and the strong acid dehydrates the 3° OH: B = CH₂=C(CH₃)COOH (methacrylic acid).
  Answer: (C)
C A 7: |-
  Concept: Diamagnetic means no unpaired electrons.
  Solution:
  1. Yb²⁺ is [Xe]4f¹⁴, a filled shell, so it is diamagnetic and the +2 state is stable.
  2. Nd²⁺ (4f⁴) is paramagnetic; La and Ce do not commonly form +2.
  Answer: (B)
C A 8: |-
  Concept: Hall–Héroult process.
  Solution:
  1. Al₂O₃ dissolved in molten cryolite (Na₃AlF₆) is electrolysed, so A is true.
  2. In Na₃AlF₆, Al is +3, so R is true.
  3. Cryolite is used to lower the melting point and raise conductivity, not because of Al's oxidation state, so R does not explain A.
  Answer: (D)
C A 9: |-
  Concept: Acid-catalysed dehydration with a carbocation rearrangement.
  Solution:
  1. (CH₃)₃C–CH(OH)CH₃ loses water to form a 2° carbocation.
  2. A 1,2-methyl shift gives a 3° carbocation, (CH₃)₂C⁺–CH(CH₃)₂.
  3. Loss of H⁺ gives the most substituted alkene, (CH₃)₂C=C(CH₃)₂ (Saytzeff).
  Answer: (B)
C A 10: |-
  Concept: Phenol–formaldehyde polymers.
  Solution:
  1. Phenol + HCHO gives o- or p-hydroxymethylphenol, which condenses to Novolac.
  Answer: (C)
C A 11: |-
  Concept: Syn gas.
  Solution:
  1. Syn gas is made from coal by C + H₂O → CO + H₂, so Statement I is true.
  2. Syn gas is CO + H₂ (water gas), not a 1 : 1 : 1 CO/CO₂/H₂ mixture, so Statement II is false.
  Answer: (B)
C A 12: |-
  Concept: Halohydrin formation.
  Solution:
  1. Br₂ forms a bromonium ion. Water attacks the more substituted carbon, which carries more δ+ (Markovnikov orientation).
  2. The product is CH₃CH(OH)CH₂Br (1-bromopropan-2-ol). A and R are both true, and R explains A.
  Answer: (C)
C A 13: |-
  Concept: Biuret, H₂N–CO–NH–CO–NH₂.
  Solution:
  1. It binds through two donor atoms (the two terminal NH₂ groups or the two O atoms), so it is bidentate: 2.
  Answer: (A)
C A 14: |-
  Concept: Periodic trends.
  Solution:
  1. Across a period, metallic character decreases and non-metallic character increases, so A is true.
  2. Ionisation enthalpy increases and electron gain enthalpy becomes more negative (its magnitude increases). The official key treats R as incorrectly stated.
  Answer: (B)
C A 15: |-
  Concept: IUPAC rules: when the lowest locant set ties, the double bond takes the lower number.
  Solution:
  1. For CH₃–C≡C–CH=C(Br)–CH₃, numbering from either end gives {2, 4}, so the ene gets 2: hex-2-en-4-yne with Br at C-2.
  2. At C-2, Br outranks CH₃; at C-3, the alkynyl group outranks H. In the figure these are on opposite sides, so the configuration is E.
  3. The name is (2E)-2-bromohex-2-en-4-yne.
  Answer: (C)
C A 16: |-
  Concept: Boyle's law: PV = nRT is constant at fixed T.
  Solution:
  1. A plot of PV against P is a horizontal straight line.
  Answer: (A)
C A 17: |-
  Concept: Simple distillation works when the boiling points differ enough (a difference of more than about 20°C).
  Solution:
  1. Propanone boils at 56°C and propan-1-ol at 97°C, a difference of about 41°C, so simple distillation works.
  2. A and R are both true, and R explains A.
  Answer: (D)
C A 18: |-
  Concept: ΔT_f = i K_f m, so the largest van 't Hoff factor i wins.
  Solution:
  1. KHSO₄ gives K⁺ + HSO₄⁻ (and partly H⁺ + SO₄²⁻), so i ≥ 2.
  2. Glucose and glycine have i ≈ 1; hydrazine is a weak base, so i ≈ 1.
  Answer: (D)
C A 19: |-
  Concept: Biochemical oxygen demand (BOD) as a measure of water pollution.
  Solution:
  1. Clean water has BOD < 5 ppm; highly polluted water has BOD ≥ 17 ppm.
  Answer: (C)
C A 20: |-
  Concept: Acid chloride formation, Friedel–Crafts acylation, then cyanohydrin formation.
  Solution:
  1. A = CH₃COCl, and B = C₆H₅COCH₃ (acetophenone).
  2. CN⁻ (from KCN/⁻OH) adds to C=O, giving C = C₆H₅C(OH)(CN)CH₃.
  Answer: (A)
C B 1: |-
  Concept: ΔG° = −nFE°, and ΔS° = (ΔH° − ΔG°)/T.
  Solution:
  1. n = 2: ΔG° = −2 × 96487 × 4.315 = −832.7 kJ.
  2. $\Delta S^\circ = \frac{-825200 + 832683}{298} = 25.1 \approx 25$ J/K.
  Answer: 25
C B 2: |-
  Concept: Molarity = moles / volume in litres, using the dihydrate molar mass of 126.
  Solution:
  1. n = 6.3/126 = 0.05 mol.
  2. M = 0.05/0.25 = 0.20 M = 20 × 10⁻².
  Answer: 20
C B 3: |-
  Concept: Group II sulphides and 50% HNO₃.
  Solution:
  1. PbS, CuS, As₂S₃ and CdS dissolve in 50% HNO₃.
  2. HgS (it needs aqua regia) and Sb₂S₃ do not.
  3. Count = 4.
  Answer: 4
C B 4: |-
  Concept: Complete reduction of –NO₂ to –NH₂ needs acidic metal or catalytic hydrogenation.
  Solution:
  1. Sn/HCl, Fe/HCl, Zn/HCl, H₂/Pd and H₂/Raney Ni all give aniline.
  2. Sn/NH₄OH (neutral or basic conditions) does not give aniline.
  3. Count = 5.
  Answer: 5
C B 5: |-
  Concept: Halic(V) acids have the formula HXO₃.
  Solution:
  1. HClO₃, HBrO₃ and HIO₃ exist.
  2. F (with no d orbitals and being the most electronegative) forms no HFO₃.
  3. Count = 3.
  Answer: 3
C B 6: |-
  Concept: For first order, $t = \frac{2.303}{k}\log\frac{a}{a - x}$.
  Solution:
  1. t₇₅ ∝ log 4 = 2 log 2, and t₅₀ ∝ log 2.
  2. The ratio is 2.
  Answer: 2
C B 7: |-
  Concept: Structure of CuSO₄·5H₂O.
  Solution:
  1. Four H₂O molecules coordinate to Cu²⁺.
  2. The fifth H₂O is held only by hydrogen bonds (to coordinated water and sulphate O), so the answer is 1.
  Answer: 1
C B 8: |-
  Concept: ΔH = energy of products − energy of reactants, which is the gap between the A + B and M + N levels.
  Solution:
  1. In the figure, y (45 kJ/mol) is the drop from A + B to M + N; x is the activation hump and z is below the product level.
  2. |ΔH| = 45 kJ/mol.
  Answer: 45
C B 9: |-
  Concept: Every s orbital has m_l = 0, and each p and d subshell has one orbital with m_l = 0.
  Solution:
  1. Ge: 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p².
  2. The filled m_l = 0 orbitals are 1s, 2s, 2p_z, 3s, 3p_z, 3d_z², 4s, which is 7.
  3. The 4p² electrons are unpaired (Hund's rule), so no 4p orbital is completely filled.
  Answer: 7
C B 10: |-
  Concept: $\mathrm{A_3B_2 \rightleftharpoons 3A^{2+} + 2B^{3-}}$ with molar solubility s = x/M.
  Solution:
  1. $K_{sp} = (3s)^3(2s)^2 = 27\times4\,s^5 = 108s^5$.
  2. a = 108.
  Answer: 108
