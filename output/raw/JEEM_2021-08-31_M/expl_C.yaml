C A 1: |-
  Concept: Acetate in acetic acid (a weakly nucleophilic, ionising solvent) reacts with alkyl chlorides by SN1 (solvolysis). The rate depends on the stability of the carbocation formed.
  Solution:
  1. 3-Chloro-1-methylcyclohexene: loses Cl⁻ to give an allylic cation with a resonance form that is tertiary (positive charge on the CH₃-bearing carbon) → most stable → fastest.
  2. Next, the secondary allylic chloride with an adjacent CH₃ (extra hyperconjugation) forms a slightly more stable cation than the unsubstituted secondary allylic one.
  3. 1-(Chloromethyl)cyclohexene gives a primary allylic cation (only weakly stabilised) → slowest.
  4. This order matches option (A).
  Why others are wrong:
  - (B) puts the primary allylic chloride first.
  - (C) and (D) do not place the tertiary-allylic-stabilised cation first.
  Note: options are orderings of drawn structures, described in words.
  Key takeaway: in SN1, rate ∝ carbocation stability: 3° allylic > 2° allylic > 1° allylic.
  Answer: (A)
C A 2: |-
  Concept: Physical adsorption is exothermic, so by Le Chatelier's principle it decreases as temperature increases. Adsorption isotherms (Freundlich) rise with pressure and level off at high pressure: $\frac{x}{m} = kP^{1/n}$ (n > 1).
  Solution:
  1. At a given P, x/m is larger at the lower temperature: T₂ < T₁ ⇒ the T₂ curve lies above the T₁ curve.
  2. The curves are concave and saturating, not straight lines.
  3. Graph (D) shows this.
  Why others are wrong:
  - (A) and (C) show straight lines.
  - (B) places the higher temperature curve above — wrong for exothermic adsorption.
  Key takeaway: lowering the temperature increases the extent of physisorption.
  Answer: (D)
C A 3: |-
  Concept: Portland cement composition (NCERT): mainly calcium silicates and aluminates formed by heating limestone and clay.
  Solution:
  1. Tricalcium silicate, Ca₃SiO₅ (3CaO·SiO₂): ~51% — the major component.
  2. Dicalcium silicate, Ca₂SiO₄: ~26%.
  3. Tricalcium aluminate, Ca₃Al₂O₆: ~11%.
  4. Gypsum is added to slow setting.
  Why others are wrong:
  - (A) tricalcium aluminate and (D) dicalcium silicate are present in smaller amounts.
  - (C) "dicalcium aluminate" is not a main component.
  Manufacture: Limestone and clay are heated to about 1700 K in a rotary kiln to form "clinker", which is then ground with 2–3% gypsum.
  Common mistake: Picking tricalcium aluminate because it sets fastest; speed of setting is not the same as abundance, and the silicate (about 51%) dominates.
  Key takeaway: the silicates are responsible for the strength of set cement.
  Answer: (B)
C A 4: |-
  Concept: The dichromate ion Cr₂O₇²⁻ consists of two CrO₄ tetrahedra sharing one corner oxygen.
  Solution:
  1. The bridging Cr–O–Cr bond is bent, with an angle of about 126° → non-linear.
  2. Both Cr–O(bridge) bonds are equal (≈ 179 pm) → symmetrical.
  3. Terminal Cr–O bonds (≈ 163 pm) are shorter and equivalent due to resonance.
  Why others are wrong:
  - (A) and (C) claim a linear bridge.
  - (D) claims unequal bridge bonds.
  Why bent: The bridging oxygen is sp³-like with two lone pairs, like the O in water or ethers, so the Cr–O–Cr angle cannot be 180°.
  Why symmetrical: The two CrO₃ halves are identical, so the two Cr–O(bridge) bonds are the same length.
  Key takeaway: chromate (CrO₄²⁻, tetrahedral, yellow) and dichromate (orange) interconvert with pH.
  Answer: (B)
C A 5: |-
  Concept: Glycosidic linkages in common carbohydrates.
  Solution:
  1. Lactose: C1 of β-D-galactose linked to C4 of D-glucose → β(1→4) linkage ✓.
  2. Sucrose: C1 of α-D-glucose linked to C2 of β-D-fructose (α1–β2).
  3. Maltose: two α-D-glucose units, α(1→4).
  4. Amylose: linear chain of α-D-glucose, α(1→4).
  How to decide α or β: The linkage takes the configuration of the anomeric carbon (C1) that forms the bond. In lactose, C1 of galactose is β, so the bond is β(1→4).
  Common mistake: Choosing maltose because it is also a 1→4 disaccharide; its C1 is α, so its link is α(1→4).
  Key takeaway: cellulose also has β(1→4) links (between glucose units), which is why humans cannot digest it.
  Answer: (A)
C A 6: |-
  Concept: A cyanohydrin (R₂C(OH)CN) can be reduced (–CN → –CH₂NH₂) or hydrolysed (–CN → –COOH). Strong acid and heat can also dehydrate a tertiary alcohol.
  Solution:
  1. LiAlH₄, then H₃O⁺: –C≡N → –CH₂NH₂; A = (CH₃)₂C(OH)CH₂NH₂ (1-amino-2-methylpropan-2-ol).
  2. H₃O⁺/H₂SO₄ (heat): –CN → –COOH, giving (CH₃)₂C(OH)COOH, which dehydrates (tertiary OH, conjugation with C=O) to B = CH₂=C(CH₃)COOH (methacrylic acid).
  Why others are wrong:
  - (A) and (B) give A as an alcohol/aldehyde — LiAlH₄ reduces nitriles to amines.
  - (D) gives B as an aldehyde — acid hydrolysis of nitriles gives carboxylic acids.
  Key takeaway: methacrylic acid made this way is the monomer precursor for PMMA (Perspex).
  Answer: (C)
C A 7: |-
  Concept: Diamagnetic species have no unpaired electrons. For Ln²⁺ ions, the f-electron count is Z − 56 (removing 6s² from [Xe]4fⁿ6s²).
  Solution:
  1. Yb (Z = 70): [Xe]4f¹⁴6s² → Yb²⁺: [Xe]4f¹⁴ — completely filled f subshell → diamagnetic, and the +2 state is stable.
  2. Nd²⁺: 4f⁴ → paramagnetic.
  3. La and Ce do not show a stable +2 state (La is +3; Ce is +3/+4).
  Magnetic check: Nd²⁺ (4f⁴) has 4 unpaired electrons and Ce²⁺ would be 4f² with 2 unpaired, so both would be paramagnetic even if they formed. La²⁺ (5d¹) would have 1 unpaired electron.
  Common mistake: Picking La because La³⁺ (4f⁰) is diamagnetic; the question asks for the +2 state.
  Key takeaway: Eu²⁺ (4f⁷, half-filled) and Yb²⁺ (4f¹⁴, filled) are the stable divalent lanthanides.
  Answer: (B)
C A 8: |-
  Concept: Hall–Héroult process: purified Al₂O₃ is dissolved in molten cryolite (Na₃AlF₆) and electrolysed. Cryolite lowers the melting point (from ~2323 K to ~1140 K) and increases electrical conductivity.
  Solution:
  1. Assertion: aluminium is extracted by electrolysing molten Al₂O₃ mixed with cryolite. TRUE.
  2. Reason: in Na₃AlF₆, 3(+1) + x + 6(−1) = 0 ⇒ Al is +3. TRUE.
  3. But the Al oxidation state in cryolite is not why cryolite is used — the reason is the lower melting point and better conductivity. So R does not explain A.
  Why others are wrong:
  - (C) claims R explains A.
  - (A) and (B) mark one statement false.
  Key takeaway: the carbon anodes are consumed (oxidised to CO/CO₂) during electrolysis.
  Answer: (D)
C A 9: |-
  Concept: Acid-catalysed dehydration proceeds via carbocations, which rearrange to more stable ones (1,2-methyl or hydride shifts). The final alkene is the most substituted (Saytzeff).
  Solution:
  1. (CH₃)₃C–CH(OH)CH₃ + H⁺ → loss of H₂O → secondary carbocation (CH₃)₃C–CH⁺–CH₃.
  2. 1,2-Methyl shift → tertiary carbocation (CH₃)₂C⁺–CH(CH₃)₂.
  3. Loss of H⁺ from the adjacent CH → (CH₃)₂C=C(CH₃)₂ (2,3-dimethylbut-2-ene, tetrasubstituted).
  Why others are wrong:
  - (D) is the unrearranged, less substituted alkene (minor).
  - (A) and (C) have the wrong carbon skeleton.
  Why the shift happens: A secondary cation next to a quaternary carbon rearranges because moving one CH₃ turns it into a more stable tertiary cation. Tertiary cations are stabilised by hyperconjugation and the +I effect of three alkyl groups.
  Key idea: Always check for 1,2-shifts before deciding the product of an E1 dehydration.
  Key takeaway: neopentyl-type alcohols almost always rearrange during E1 dehydration.
  Answer: (B)
C A 10: |-
  Concept: Phenol–formaldehyde polymers form by condensation. Phenol first reacts with formaldehyde to give o- and p-hydroxymethylphenols, which then condense with each other (and with phenol) through –CH₂– bridges.
  Solution:
  1. The monomer unit for Novolac is o-hydroxymethylphenol (and its para isomer).
  2. Linear condensation gives Novolac; further heating with HCHO cross-links it to Bakelite.
  Why others are wrong:
  - (A) 3-Hydroxybutanoic acid is a monomer of PHBV (biodegradable polyester).
  - (B) Phenol and melamine are not used together for Novolac.
  - (D) Butadiene and styrene form Buna-S rubber.
  Key takeaway: Novolac is used in paints; Bakelite (cross-linked) is a thermoset.
  Answer: (C)
C A 11: |-
  Concept: Syn gas (synthesis gas) is a mixture of CO and H₂, used to make methanol and hydrocarbons.
  Solution:
  1. Statement I: producing syn gas from coal (C + H₂O → CO + H₂ at high temperature) is called coal gasification. TRUE.
  2. Statement II: syn gas is CO + H₂; it is not a 1 : 1 : 1 mixture of CO, CO₂ and H₂. FALSE.
  Why others are wrong:
  - (A) and (D) accept Statement II.
  - (C) rejects Statement I.
  Key takeaway: the water-gas shift reaction (CO + H₂O → CO₂ + H₂) is used to increase the H₂ content.
  Answer: (B)
C A 12: |-
  Concept: Halohydrin formation: Br₂ adds to the alkene to form a cyclic bromonium ion. Water (the solvent, present in large excess) opens it by attacking the more substituted carbon, which bears more δ+ character (Markovnikov orientation).
  Solution:
  1. Propene + Br₂ → bromonium ion across C1–C2.
  2. H₂O attacks C2 (more substituted) → CH₃–CH(OH)–CH₂Br after deprotonation.
  3. Product: 1-bromopropan-2-ol. Assertion TRUE.
  4. Reason correctly explains why OH goes to C2. TRUE and explains A.
  Why others are wrong:
  - (A) denies the link; (B) and (D) reject one statement.
  Key takeaway: in halohydrin formation, the halogen ends up on the less substituted carbon, OH on the more substituted.
  Answer: (C)
C A 13: |-
  Concept: Denticity = number of donor atoms through which a ligand binds to one metal ion.
  Solution:
  1. Biuret: H₂N–CO–NH–CO–NH₂.
  2. It chelates a metal ion (e.g. Cu²⁺ in the biuret test) through two donor atoms — the two terminal NH₂ nitrogens (or the two carbonyl oxygens) — forming a six-membered ring.
  3. Denticity = 2 (bidentate).
  Why not 3: Biuret has several potential donor atoms (three N and two O), but its geometry allows only two of them to reach the same metal ion at once, forming a stable six-membered chelate ring.
  Common mistake: Counting all the nitrogen atoms (3) as donors; denticity counts atoms actually bonded to one metal.
  Key takeaway: the violet colour of the biuret test comes from Cu²⁺ complexed by the peptide-like nitrogens.
  Answer: (A)
C A 14: |-
  Concept: Across a period, effective nuclear charge increases, so atoms hold electrons more tightly.
  Solution:
  1. Assertion: metallic character decreases and non-metallic character increases from left to right. TRUE.
  2. Reason: ionisation enthalpy increases (correct), but electron gain enthalpy becomes more negative (i.e. its magnitude increases); describing it as a "decrease" is treated as incorrect by the official key. So R is FALSE.
  Why others are wrong:
  - (A) rejects the true Assertion.
  - (C) and (D) accept the Reason.
  Why the official key rejects R: Across a period, electron gain enthalpy becomes more negative (more energy released), which the key reads as an "increase" in electron-gain tendency, not a "decrease".
  Also, metallic character is linked mainly to low ionisation enthalpy; the reason as worded is judged incorrect.
  Key takeaway: be careful with the language "increase/decrease" for negative quantities like electron gain enthalpy.
  Answer: (B)
C A 15: |-
  Concept: IUPAC numbering for enynes: give the lowest locants to the multiple bonds as a set; if there is a tie, the double bond gets the lower number. Then assign E/Z by CIP priorities.
  Solution:
  1. Chain: CH₃–C≡C–CH=C(Br)–CH₃ (6 carbons).
  2. Numbering from the right: double bond at 2, triple at 4 → {2, 4}. From the left: triple at 2, double at 4 → {2, 4}. Tie ⇒ the double bond gets 2.
  3. Name skeleton: hex-2-en-4-yne with Br on C-2 → 2-bromohex-2-en-4-yne.
  4. Configuration: on C-2, Br > CH₃; on C-3, the alkynyl group > H. In the figure these higher-priority groups are on opposite sides → E.
  5. (2E)-2-Bromohex-2-en-4-yne.
  Why others are wrong:
  - (A) and (D) number from the wrong end.
  - (B) writes "yn" before "ene" — alphabetical/IUPAC order is "en…yne".
  Key takeaway: in names, "-en-" always precedes "-yne".
  Answer: (C)
C A 16: |-
  Concept: For an ideal gas at constant temperature, PV = nRT = constant (Boyle's law).
  Solution:
  1. PV does not change with P, so the PV vs P graph is a horizontal straight line.
  Why others are wrong:
  - (B) a hyperbola is the P vs V graph.
  - (C) and (D) sloping lines describe real gases at high pressure (positive or negative deviations).
  Real gases for contrast: H₂ and He give PV rising with P (Z > 1, repulsion dominates). Most gases at moderate pressure first dip below the ideal line (Z < 1, attraction dominates) and then rise.
  Common mistake: Picking the hyperbola, which is the P–V (Boyle) plot, not the PV–P plot.
  Key takeaway: deviations of the PV–P plot from horizontal measure non-ideal behaviour (compressibility factor Z ≠ 1).
  Answer: (A)
C A 17: |-
  Concept: Simple distillation separates liquids whose boiling points differ substantially (a common guideline: more than about 20–25 °C). Closer boiling points need fractional distillation.
  Solution:
  1. Propanone (acetone) boils at 56 °C; propan-1-ol at 97 °C — a difference of about 41 °C.
  2. So simple distillation works. Assertion TRUE.
  3. The Reason states the criterion that makes simple distillation effective. TRUE, and it explains A.
  Why others are wrong:
  - (B) denies the link; (A) and (C) reject a true statement.
  Practical note: The lower-boiling propanone distils first and collects in the receiver, while propanol stays in the flask until the temperature rises to about 97 °C.
  Contrast: Mixtures with close boiling points (for example the components of crude oil) need fractional distillation with a fractionating column.
  Key takeaway: for liquids with close boiling points (e.g. crude oil fractions), use fractional distillation.
  Answer: (D)
C A 18: |-
  Concept: Freezing-point depression ΔT_f = iK_fm: at equal concentration, the solute giving the most particles (largest i) has the largest depression.
  Solution:
  1. KHSO₄ → K⁺ + HSO₄⁻, and HSO₄⁻ partly ionises further to H⁺ + SO₄²⁻ ⇒ i ≈ 2–3.
  2. Glucose: non-electrolyte, i = 1.
  3. Glycine: exists as a zwitterion, still one particle, i ≈ 1.
  4. Hydrazine: a very weak base, i ≈ 1.
  5. So KHSO₄ gives the largest depression.
  Calculation: ΔT_f = iK_fm. With K_f = 1.86 K kg mol⁻¹ and m ≈ 0.1, glucose gives about 0.186 K, while KHSO₄ (i ≈ 2–3) gives about 0.37–0.56 K.
  Common mistake: Thinking glycine counts as two ions; its zwitterion carries both charges in one particle, so i ≈ 1.
  Key takeaway: electrolytes always beat non-electrolytes at the same molarity.
  Answer: (D)
C A 19: |-
  Concept: BOD (biochemical oxygen demand) is the amount of oxygen needed by bacteria to break down organic matter in water. High BOD indicates heavy pollution.
  Solution:
  1. Clean water: BOD less than 5 ppm.
  2. Highly polluted water: BOD of 17 ppm or more.
  3. So A < 5, B > 17.
  Why others are wrong:
  - (A), (B), (D) give clean water very high BOD values.
  Why BOD rises with pollution: Organic waste feeds aerobic bacteria, which use up dissolved oxygen as they break it down. The more organic matter, the more oxygen is consumed in the 5-day test.
  Common mistake: Reading "high BOD" as "high oxygen content"; high BOD means high oxygen demand and so low dissolved oxygen left for aquatic life.
  Key takeaway: fish need dissolved oxygen of about 6 ppm; high BOD depletes it.
  Answer: (C)
C A 20: |-
  Concept: Sequence: (1) SOCl₂ converts a carboxylic acid into an acid chloride. (2) Friedel–Crafts acylation attaches the acyl group to benzene. (3) Cyanide adds to the ketone C=O to form a cyanohydrin.
  Solution:
  1. CH₃COOH + SOCl₂ → A = CH₃COCl + SO₂ + HCl.
  2. A + C₆H₆ (AlCl₃) → B = C₆H₅COCH₃ (acetophenone).
  3. B + KCN/OH⁻ → C = C₆H₅C(OH)(CN)CH₃ (acetophenone cyanohydrin).
  Why others are wrong:
  - (B) places CN on the ring — cyanide adds to C=O, not the ring.
  - (C) and (D) involve further hydrolysis or reduction not described.
  Key takeaway: cyanohydrins are useful intermediates for α-hydroxy acids and amino alcohols.
  Answer: (A)
C B 1: |-
  Concept: For a cell reaction, ΔG° = −nFE°. Then ΔG° = ΔH° − TΔS° gives $\Delta S^\circ = \frac{\Delta H^\circ - \Delta G^\circ}{T}$.
  Solution:
  1. Cd → Cd²⁺ + 2e⁻, so n = 2.
  2. ΔG° = −2 × 96487 × 4.315 = −832,683 J ≈ −832.7 kJ.
  3. $\Delta S^\circ = \frac{-825200 - (-832683)}{298} = \frac{7483}{298} = 25.1$ J K⁻¹ ≈ 25.
  Note: the stated E° (4.315 V) is much larger than that of the real Weston cell (≈ 1.02 V); the data are used as given.
  Sign check: ΔG° (−832.7 kJ) is more negative than ΔH° (−825.2 kJ), so −TΔS° is negative and ΔS° is positive.
  Common mistake: Forgetting to convert kJ to J before dividing by T, which gives 0.025 instead of 25 J K⁻¹; or using n = 1 instead of n = 2.
  Answer: 25
C B 2: |-
  Concept: Molarity = moles of solute / volume of solution in litres. Use the molar mass of the dihydrate, since that is what was weighed.
  Solution:
  1. H₂C₂O₄·2H₂O: 2 + 24 + 64 + 36 = 126 g/mol.
  2. Moles = $\frac{6.3}{126} = 0.05$ mol.
  3. M = $\frac{0.05}{0.250} = 0.20$ M = 20 × 10⁻² mol L⁻¹.
  Common mistake: Using the anhydrous molar mass (90 g/mol) gives 6.3/90 = 0.07 mol and 0.28 M. The water of crystallisation is part of the weighed solid.
  Assumption: The final volume is taken as 250 mL (volume change on dissolving neglected).
  Key takeaway: oxalic acid dihydrate is a primary standard for titrations.
  Answer: 20
C B 3: |-
  Concept: In qualitative analysis, group II sulphides are treated with 50% HNO₃ to separate them. Most dissolve (oxidised to sulphates/nitrates with S deposited); some do not.
  Solution:
  1. PbS, CuS, CdS dissolve in 50% (hot) HNO₃.
  2. As₂S₃ dissolves (oxidised to arsenic acid) per the official solution.
  3. HgS does not dissolve (needs aqua regia).
  4. Sb₂S₃ forms insoluble oxide (not dissolved) in the key's treatment.
  5. Count = 4.
  Why the separation matters: In the group II scheme, the black residue that does not dissolve in 50% HNO₃ indicates HgS, which is then confirmed by dissolving it in aqua regia and testing with SnCl₂.
  The answer follows the official key's count of 4.
  Key takeaway: HgS is the classic sulphide insoluble in HNO₃ but soluble in aqua regia.
  Answer: 4
C B 4: |-
  Concept: Nitrobenzene is reduced to aniline by metals in acid (Sn/HCl, Fe/HCl, Zn/HCl) or by catalytic hydrogenation (H₂ with Pd, Pt or Ni). In neutral/basic conditions, reduction stops at intermediate stages (e.g. azoxybenzene, hydrazobenzene).
  Solution:
  1. Sn–HCl ✓, Fe–HCl ✓, Zn–HCl ✓ (acidic metal reductions).
  2. H₂–Pd ✓, H₂–Raney Ni ✓ (catalytic hydrogenation).
  3. Sn–NH₄OH ✗ (basic medium — does not give aniline).
  4. Count = 5.
  Mechanism in brief: In acid, the metal supplies electrons and HCl supplies protons, taking Ar–NO₂ through Ar–NO and Ar–NHOH to Ar–NH₂ (6 electrons and 6 protons in total).
  Common mistake: Counting Sn–NH₄OH; without acid the reduction stops at coupled products such as azoxybenzene and azobenzene.
  Key takeaway: Fe/HCl is preferred industrially because FeCl₂ formed is hydrolysed, regenerating HCl.
  Answer: 5
C B 5: |-
  Concept: Halic(V) acids are HXO₃ (halogen in +5 oxidation state).
  Solution:
  1. Chloric acid HClO₃, bromic acid HBrO₃ and iodic acid HIO₃ exist.
  2. Fluorine, being the most electronegative element and lacking d orbitals, shows only −1 (and 0) oxidation states; HOF is the only known fluorine oxoacid.
  3. Count = 3.
  Structure: In HXO₃, the halogen is at the centre of a trigonal pyramid with one OH, two X=O bonds and one lone pair.
  Common mistake: Counting fluorine; because F is the most electronegative element, it can never be assigned a positive oxidation state such as +5.
  Answer: 3
C B 6: |-
  Concept: For a first-order reaction, $t = \frac{2.303}{k}\log\frac{a}{a - x}$.
  Solution:
  1. 50% completion: $t_{50} = \frac{2.303}{k}\log2$.
  2. 75% completion: $t_{75} = \frac{2.303}{k}\log4 = \frac{2.303}{k}\times2\log2$.
  3. Ratio = 2.
  Quick reasoning: After one half-life 50% remains; after a second half-life half of that is left (25% remaining = 75% complete). So t₇₅ = 2 × t₅₀ for any first-order reaction.
  Common mistake: Assuming time scales linearly with the fraction completed (which would give 1.5).
  Key takeaway: 75% completion is two half-lives for a first-order reaction.
  Answer: 2
C B 7: |-
  Concept: In blue vitriol, CuSO₄·5H₂O, four water molecules coordinate to Cu²⁺ in a square plane (with sulphate oxygens completing a distorted octahedron). The fifth water is not bonded to copper.
  Solution:
  1. The fifth H₂O is held in the lattice by hydrogen bonds to coordinated water molecules and sulphate oxygens.
  2. Number of hydrogen-bonded water molecules = 1.
  Structural detail: The Cu²⁺ ion is surrounded by four H₂O in a square plane and two sulphate oxygens axially (distorted octahedron). The non-coordinated water links the complex and the sulphate through hydrogen bonds.
  So the formula is best written [Cu(H₂O)₄]SO₄·H₂O.
  Key takeaway: this is why CuSO₄·5H₂O loses its waters in stages on heating — the H-bonded water is lost last.
  Answer: 1
C B 8: |-
  Concept: ΔH of a reaction = (energy of products) − (energy of reactants), read from the energy profile as the vertical gap between the reactant and product levels; the activation energy hump does not matter.
  Solution:
  1. From the figure: y = 45 kJ/mol is the gap between the A + B level and the M + N level.
  2. x = 20 kJ/mol relates to the activation barrier, and z = 15 kJ/mol to another level difference, neither of which is ΔH.
  3. |ΔH| = 45 kJ mol⁻¹.
  Key takeaway: a catalyst lowers the activation energy but does not change ΔH.
  Answer: 45
C B 9: |-
  Concept: Orbitals with m_l = 0: every s orbital; one of the three p orbitals (p_z) in each p subshell; one of the five d orbitals (d_z²) in each d subshell. "Completely filled" means containing 2 electrons.
  Solution:
  1. Ge (Z = 32): 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p².
  2. Filled m_l = 0 orbitals: 1s, 2s, 2p_z, 3s, 3p_z, 3d_z², 4s → 7.
  3. The two 4p electrons occupy different p orbitals (Hund's rule), so no 4p orbital is filled.
  4. x = 7.
  Why the 3d counts: 3d¹⁰ is completely filled, so each of its five orbitals holds 2 electrons, including the m_l = 0 one (d_z²).
  Common mistake: Counting only the s orbitals (4) and forgetting the p_z and d_z² orbitals, or counting a 4p orbital as filled.
  Answer: 7
C B 10: |-
  Concept: For a salt AₓBᵧ dissociating as AₓBᵧ ⇌ xA + yB with molar solubility s: $K_{sp} = (xs)^x(ys)^y = x^xy^ys^{x+y}$.
  Solution:
  1. A₃B₂ → 3A²⁺ + 2B³⁻; molar solubility s = $\frac{x}{M}$ mol L⁻¹.
  2. $K_{sp} = (3s)^3(2s)^2 = 27\times4\,s^5 = 108s^5$.
  3. a = 108.
  Why x/M: The solubility is given in grams per litre. Dividing by the molar mass converts it to moles per litre, which is what enters the K_sp expression.
  General pattern: For AₓBᵧ, K_sp = xˣyʸsˣ⁺ʸ; for example, AB₂ gives 4s³ and A₂B₃ gives 108s⁵ too.
  Key takeaway: remember to raise both the stoichiometric coefficient and s to the power.
  Answer: 108
