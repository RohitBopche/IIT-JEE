M B 5: |-
  Concept: The rth factors form APs: 7, 10, 13, … = 3r + 4 and 8, 10, 12, … = 2r + 6. Expand the product and use standard sums.
  Solution:
  1. rth term = (3r + 4)(2r + 6) = 6r² + 26r + 24.
  2. Sum for r = 1 to 10: 6(385) + 26(55) + 24(10) = 2310 + 1430 + 240 = 3980.
  3. Mean = $\frac{3980}{10} = 398$.
