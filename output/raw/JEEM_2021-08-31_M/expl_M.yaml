M A 13: |-
  Concept: No solution requires D = 0 together with inconsistency.
  Solution:
  1. D = $\begin{vmatrix}2&1&1\\1&-1&1\\1&1&a\end{vmatrix} = 2(-a - 1) - (a - 1) + 2 = 1 - 3a$ ⇒ a = $\frac{1}{3}$.
