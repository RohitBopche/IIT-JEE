  2. Integrate: $\frac{\ln(2^y - 1)}{\ln2} = \frac{2^x}{\ln2} + C'$ ⇒ $\ln(2^y - 1) = 2^x + C$.
  3. y(0) = 1: ln 1 = 1 + C ⇒ C = −1.
