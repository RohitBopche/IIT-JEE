M A 14: |-
  Concept: For a parabola, the latus rectum length is 4a, where a is the distance from the vertex to the focus.
  Solution:
  1. Vertex at (R, 0), focus at (S, 0) with S > R ⇒ a = S − R.
  2. Latus rectum = 4(S − R).
  Why others are wrong:
  - (A) and (D) use S + R.
  - (B) 2(S − R) is half the latus rectum.
  Setup: With the axis along the x-axis and the parabola opening towards +x, its equation is y² = 4(S − R)(x − R). The latus rectum is the focal chord perpendicular to the axis, of length 4a.
  Common mistake: Using the distance of the focus from the origin (S) as a; a is measured from the vertex, not the origin.
  Key takeaway: the latus rectum depends only on the vertex–focus distance, not on the position of the parabola.
  Answer: (C)
M A 15: |-
