M B 6: |-
  Concept: A line lies between two circles without cutting them if it separates their centres and is at least a radius away from each.
  Solution:
  1. At centre (1, 1): 3 + 4 = 7; at (9, 1): 27 + 4 = 31. The line separates them if 7 < α < 31.
  2. Distance from (1, 1) ≥ 1: $\frac{|\alpha - 7|}{5} \ge 1$ ⇒ α ≥ 12.
  3. Distance from (9, 1) ≥ 2: $\frac{|31 - \alpha|}{5} \ge 2$ ⇒ α ≤ 21.
  4. Integers 12 to 21: sum = $\frac{10(12 + 21)}{2} = 165$.
  Why α must lie between 7 and 31: The values 3x + 4y at the two centres are 7 and 31; the line 3x + 4y = α separates them only if α is strictly between these values.
  Common mistake: Allowing α outside (7, 31), where the line is not between the circles.
  Answer: 165
M B 7: |-
  Concept: "Consonants never all together" = total arrangements − arrangements with all consonants in one block.
  Solution:
  1. VOWELS: 6 distinct letters; vowels O, E; consonants V, W, L, S.
  2. Total: 6! = 720.
  3. All four consonants together: treat them as one block → 3 units (block, O, E): 3! × 4! = 144.
  4. Required: 720 − 144 = 576.
  Interpretation: "All the consonants never come together" means we exclude only the arrangements in which all four consonants form one block. Arrangements with two or three consonants adjacent are allowed.
  Common mistake: Reading it as "no two consonants adjacent"; with only 2 vowels there are 3 gaps for 4 consonants, so that would give 0 arrangements.
  Answer: 576
M B 8: |-
