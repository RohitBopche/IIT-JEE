M A 20: |-
  Concept: For the ellipse $\frac{x^2}{a^2} + \frac{y^2}{b^2} = 1$, the tangent at (a cos θ, b sin θ) is $\frac{x\cos\theta}{a} + \frac{y\sin\theta}{b} = 1$.
