M A 1: |-
  Concept: An implication X ⇒ Y is false only when X is true and Y is false. For a tautology, every case where the premise is true must make the conclusion true.
  Solution:
  1. Take * = ∧: the premise p ∧ ∼q is true only when p = T, q = F. Then p ∨ q = T, so with □ = ∨ the implication is always true — a tautology ✓.
  2. Check the others:
     - (A) * = ∨, □ = ∨: p = F, q = F → premise p ∨ ∼q = T, conclusion p ∨ q = F → false.
     - (B) * = ∧, □ = ∧: p = T, q = F → premise T, conclusion p ∧ q = F → false.
     - (D) * = ∨, □ = ∧: p = F, q = F → premise T, conclusion F → false.
  Key takeaway: to test for a tautology, look for one falsifying assignment; if none exists, it is a tautology.
  Answer: (C)
M A 2: |-
  Concept: Put t = eˣ > 0; the number of real x equals the number of positive roots t. Use the behaviour of g(t) and its derivative.
  Solution:
  1. g(t) = t⁴ + 2t³ − t − 6.
  2. g(0) = −6, g(1) = −4, g(2) = 16 + 16 − 2 − 6 = 24.
  3. g′(t) = 4t³ + 6t² − 1 is increasing for t > 0 (its derivative 12t² + 12t > 0) and starts at −1, so it has exactly one positive zero: g first decreases, then increases.
  4. Since g(0) < 0, g crosses zero exactly once for t > 0 (between 1 and 2).
  5. So the equation has exactly 1 real root.
  Why others are wrong:
  - (A) 2 and (B) 4 count negative or complex roots of the polynomial, which give no real x.
  - (D) 0 ignores the sign change between t = 1 and t = 2.
  Key takeaway: Descartes' rule (signs +, +, −, −: one change) also confirms exactly one positive root.
  Answer: (C)
M A 3: |-
  Concept: The nth term $\frac{2n + 1}{n^2(n + 1)^2}$ telescopes, since $(n + 1)^2 - n^2 = 2n + 1$.
  Solution:
  1. $\frac{2n + 1}{n^2(n + 1)^2} = \frac{(n + 1)^2 - n^2}{n^2(n + 1)^2} = \frac{1}{n^2} - \frac{1}{(n + 1)^2}$.
  2. Sum of 10 terms: $1 - \frac{1}{11^2} = 1 - \frac{1}{121} = \frac{120}{121}$.
  Why others are wrong:
  - (A) 1 is the infinite sum.
  - (C) $\frac{99}{100}$ stops at n = 9 (1 − 1/10²).
  - (D) $\frac{143}{144}$ goes to n = 11.
  Key takeaway: when the numerator equals the difference of the denominator's factors, expect telescoping.
  Answer: (B)
M A 4: |-
  Concept: Any plane containing the line of intersection is $P_1 + \lambda P_2 = 0$; fix λ with the given point.
  Solution:
  1. At (1, 4, −3): P₁ = 3 − 8 − 12 − 7 = −24; P₂ = 1 + 20 + 6 + 9 = 36.
  2. −24 + 36λ = 0 ⇒ λ = $\frac{2}{3}$.
  3. Multiply by 3: 3P₁ + 2P₂ = 11x + 4y + 8z − 3 = 0.
  4. To match the form αx + βy + γz + 3 = 0, multiply by −1: −11x − 4y − 8z + 3 = 0.
  5. α + β + γ = −23.
  Why others are wrong:
  - (C) 23 keeps the wrong sign of the constant.
  - (B) and (D) come from arithmetic slips in λ.
  Key takeaway: match the given constant term before reading off coefficients.
  Answer: (A)
M A 5: |-
  Concept: Differentiate both sides of the integral identity (fundamental theorem of calculus), solve the resulting differential equation, then evaluate the limit.
  Solution:
  1. $\sqrt{1 - f'(x)^2} = f(x)$ ⇒ $f'^2 = 1 - f^2$.
  2. With f ≥ 0 and f(0) = 0 (f increasing from 0): $f' = \sqrt{1 - f^2}$ ⇒ $\sin^{-1}f = x$ ⇒ f(x) = sin x.
  3. $\frac{1}{x^2}\int_0^x\sin t\,dt = \frac{1 - \cos x}{x^2} \to \frac{1}{2}$.
  Why others are wrong:
  - (A) 0 and (B) 1 misjudge the order of 1 − cos x (which is x²/2).
  - (C) The limit exists and is finite.
  Key takeaway: alternatively, by L'Hôpital: $\lim\frac{f(x)}{2x} = \frac{f'(0)}{2} = \frac{1}{2}$.
  Answer: (D)
M A 6: |-
  Concept: Square the magnitudes and use $\vec a\cdot\vec b = |\vec a||\vec b|\cos60°$. Since $\frac{1}{8}\vec a$ is a unit vector, |a| = 8.
  Solution:
  1. $\vec a\cdot\vec b = 8|\vec b|\times\frac{1}{2} = 4|\vec b|$.
  2. $|2\vec a + 3\vec b|^2 = 4(64) + 12(4|\vec b|) + 9|\vec b|^2 = 256 + 48|\vec b| + 9|\vec b|^2$.
  3. $|3\vec a + \vec b|^2 = 9(64) + 6(4|\vec b|) + |\vec b|^2 = 576 + 24|\vec b| + |\vec b|^2$.
  4. Equate: $8|\vec b|^2 + 24|\vec b| - 320 = 0 \Rightarrow |\vec b|^2 + 3|\vec b| - 40 = 0 \Rightarrow |\vec b| = 5$.
  Why others are wrong:
  - (A) 4, (B) 6, (D) 8 do not satisfy the quadratic.
  Answer: (C)
M A 7: |-
  Concept: |g(x)| is non-differentiable at simple zeros of g (where g changes sign). Multiplying by a smooth, non-zero function does not remove these corners.
  Solution:
  1. |9x² − 12x + 4| = |(3x − 2)²| = (3x − 2)² — smooth, so $e^{(3x - 2)^2}$ is differentiable and positive.
  2. |x² − 2x − 3| = |(x − 3)(x + 1)| has corners at x = 3 and x = −1.
  3. So f is not differentiable at exactly 2 points.
  Why others are wrong:
  - (B) counts x = ⅔, where the inner quadratic has a double root (no corner, since it is a perfect square).
  - (A) and (D) miscount.
  Key takeaway: a double root inside an absolute value does not create a corner.
  Answer: (C)
M A 8: |-
  Concept: Take the GP as a, ar, ar². After doubling the middle term, a, 2ar, ar² are in AP, so 2(2ar) = a + ar².
  Solution:
  1. 4r = 1 + r² ⇒ r² − 4r + 1 = 0 ⇒ r = 2 ± √3; increasing GP ⇒ r = 2 + √3 (with a > 0).
  2. Fourth term: ar³ = 3r² ⇒ a = $\frac{3}{r}$ = 3(2 − √3).
  3. d = 2ar − a = a(2r − 1) = 6 − $\frac{3}{r}$ = 6 − 3(2 − √3) = 3√3.
  4. r² = (2 + √3)² = 7 + 4√3.
  5. r² − d = 7 + 4√3 − 3√3 = 7 + √3.
  Why others are wrong:
  - (A), (C), (D) arise from choosing r = 2 − √3 or sign slips.
  Key takeaway: $\frac{1}{2 + \sqrt3} = 2 - \sqrt3$ simplifies the arithmetic.
  Answer: (B)
M A 9: |-
  Concept: Test reflexive, symmetric and transitive properties directly, using counter-examples where they fail.
  Solution:
  1. (B) R: 0 < |x − y| ≤ 1. Symmetric ✓ (|x − y| = |y − x|). Transitive? (0, 1) ∈ R and (1, 2) ∈ R, but (0, 2): |0 − 2| = 2 > 1 ∉ R. Not transitive → statement (B) is NOT correct.
  Why others are correct statements:
  - (A) 0 < |x| − |y| ≤ 1: not symmetric (if |x| − |y| > 0 then |y| − |x| < 0); not transitive (e.g. (2, 1.2), (1.2, 0.5) ∈ R but 2 − 0.5 = 1.5 > 1).
  - (C) |x| − |y| ≤ 1: reflexive (0 ≤ 1) but not symmetric (x = 0, y = 5).
  - (D) |x − y| ≤ 1: reflexive and symmetric (not transitive, but that is not claimed).
  Key takeaway: "closeness" relations like |x − y| ≤ 1 are almost never transitive.
  Answer: (B)
M A 10: |-
  Concept: For integrands of the form $(x - a)^m(x - b)^n$ with m + n = −2, substitute $t = \frac{x - a}{x - b}$.
  Solution:
  1. $\frac{1}{(x - 1)^{3/4}(x + 2)^{5/4}} = \left(\frac{x - 1}{x + 2}\right)^{-3/4}\cdot\frac{1}{(x + 2)^2}$.
  2. $t = \frac{x - 1}{x + 2}$ ⇒ $dt = \frac{3}{(x + 2)^2}dx$.
  3. $I = \frac{1}{3}\int t^{-3/4}dt = \frac{1}{3}\cdot4t^{1/4} + C = \frac{4}{3}\left(\frac{x - 1}{x + 2}\right)^{1/4} + C$.
  Why others are wrong:
  - (A) and (B) invert the fraction and use ¾.
  - (D) has the wrong power.
  Key takeaway: the condition "exponents sum to −2" signals this substitution.
  Answer: (C)
M A 11: |-
  Concept: Distance from the origin to ax + by = c is $\frac{|c|}{\sqrt{a^2 + b^2}}$. Normalise each line.
  Solution:
  1. Line 1 × sin α cos α: x cos α − y sin α = k cot 2α · sin α cos α = $\frac{k}{2}\cos2\alpha$. Normal is a unit vector, so p = $\frac{|k\cos2\alpha|}{2}$.
  2. Line 2: x sin α + y cos α = k sin 2α, already normalised: q = |k sin 2α|.
  3. 4p² + q² = k²cos²2α + k²sin²2α = k².
  Why others are wrong:
  - (B), (C), (D) use wrong coefficients that don't eliminate α.
  Key takeaway: combine p and q so that sin² + cos² = 1 removes the parameter.
  Answer: (A)
M A 12: |-
  Concept: $\sin18° = \frac{\sqrt5 - 1}{4}$, so cosec 18° = $\frac{4}{\sqrt5 - 1} = \sqrt5 + 1$.
  Solution:
  1. x = 1 + √5 ⇒ x − 1 = √5 ⇒ (x − 1)² = 5 ⇒ x² − 2x − 4 = 0.
  2. So cosec 18° is a root of x² − 2x − 4 = 0.
  Why others are wrong:
  - (A) x² + 2x − 4 = 0 has roots −1 ± √5 (sign flipped).
