  3. So k = −4 and $\frac{1}{a} + \frac{1}{b} = -4$.
  4. $\frac{1}{a} + \frac{1}{b} + \frac{4}{k} = -4 + (-1) = -5$.
  Why others are wrong:
  - (B) and (D) have sign errors; (C) omits the 4/k term.
