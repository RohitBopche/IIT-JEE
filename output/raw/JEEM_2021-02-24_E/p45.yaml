  q: |-
    For integers n and r, let $\binom{n}{r} = \begin{cases} {}^nC_r, & \text{if } n \ge r \ge 0 \\ 0, & \text{otherwise} \end{cases}$. The maximum value of k for which the sum $\sum_{i=0}^{k}\binom{10}{i}\binom{15}{k - i} + \sum_{i=0}^{k+1}\binom{12}{i}\binom{13}{k + 1 - i}$ exists, is equal to________.
  a: '12'
  ch: Binomial Theorem
  tp: Vandermonde identity
  df: M
