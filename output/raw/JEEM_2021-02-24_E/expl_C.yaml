C A 1: |-
  Concept: Aryl halides undergo nucleophilic substitution (addition–elimination) more easily when electron-withdrawing groups sit ortho/para to the halogen and stabilise the Meisenheimer (carbanion) intermediate.
  Solution:
  1. Chlorobenzene has no activating group and is the least reactive.
  2. Each extra ortho/para $-NO_2$ group stabilises the negative intermediate more.
  3. Order: chlorobenzene < 4-nitro < 2,4-dinitro < 2,4,6-trinitro, i.e. (i) < (ii) < (iii) < (iv).
  Answer: (C)
C A 2: |-
  Concept: Common ores of metals.
  Solution:
  1. Aluminium: kaolinite (clay, $Al_2(OH)_4Si_2O_5$), (a)–(iii).
  2. Iron: siderite ($FeCO_3$), (b)–(i).
  3. Copper: malachite ($CuCO_3\cdot Cu(OH)_2$), (c)–(iv).
  4. Zinc: calamine ($ZnCO_3$), (d)–(ii).
  Answer: (C)
C A 3: |-
  Concept: Characteristic flame colours of alkali metal salts.
  Solution:
  1. Li: crimson red (670.8 nm; printed as 970.8 nm, the longest wavelength listed), (a)–(ii).
  2. Na: golden yellow, 589.2 nm, (b)–(iv).
  3. Rb: red-violet, 780.0 nm, (c)–(iii).
  4. Cs: blue, 455.5 nm, (d)–(i).
  Answer: (B)
C A 4: |-
  Concept: Distribution of hydrogen in the universe versus the earth's atmosphere.
  Solution:
  1. Assertion: hydrogen makes up about 70% of the universe's mass, but the troposphere is mostly $N_2$ and $O_2$. True.
  2. Reason: being the lightest gas, $H_2$ molecules move fast enough to escape the earth's gravity, so little remains in the atmosphere. True, and this explains the Assertion.
  Answer: (B)
C A 5: |-
  Concept: Biochemical Oxygen Demand (BOD) is the oxygen needed by bacteria to break down organic matter in water.
  Solution:
  1. Statement I: a high BOD depletes dissolved oxygen and kills aquatic life, so BOD matters for their survival. True.
  2. Statement II: clean water has BOD below 5 ppm (polluted water 17 ppm or more). 6.5 ppm is not an "optimum" BOD (it is close to the typical dissolved-oxygen level). False.
  Answer: (C)
C A 6: |-
  Concept: Acid-catalysed hydration of alkynes ($HgSO_4$/$H_2SO_4$) follows Markovnikov's rule; only ethyne gives an aldehyde.
  Solution:
  1. Ethyne gives $CH_3CHO$ (option C is possible).
  2. Terminal alkynes $R-C\equiv CH$ give methyl ketones $R-CO-CH_3$: cyclohexylethyne gives cyclohexyl methyl ketone and but-1-yne gives butan-2-one (B and D are possible).
  3. Propanal ($CH_3CH_2CHO$) would need anti-Markovnikov hydration; propyne gives acetone instead. So propanal cannot be made this way.
  Answer: (A)
C A 7: |-
  Concept: An aromatic compound is cyclic, planar, fully conjugated and has (4n + 2) π electrons.
  Solution:
  1. Furan (6π, O lone pair included) and anthracene (14π) are aromatic.
  2. Cyclobutadiene dication has 2π electrons (n = 0), so it is aromatic.
  3. Cyclohepta-1,3,5-triene has one $sp^3$ $CH_2$ carbon, which breaks the cyclic conjugation, so it is non-aromatic.
  Answer: (B)
C A 8: |-
  Concept: Properties of d-block compounds.
  Solution:
  1. $VOSO_4$ contains V(IV), which is readily oxidised to V(V), so it is a reducing agent. Correct.
  2. The red colour of ruby is due to $Cr^{3+}$ ions in $Al_2O_3$, not $Co^{3+}$. Incorrect.
  3. $Cr_2O_3$ reacts with both acids and bases, so it is amphoteric. Correct.
  4. $RuO_4$ (Ru in +8) is a strong oxidising agent. Correct.
  Answer: (B)
C A 9: |-
  Concept: Bohr model: $r \propto \frac{n^2}{Z}$ and $v \propto \frac{Z}{n}$.
  Solution:
  1. (A) KE $= \frac{1}{2}mv^2 \propto \frac{Z^2}{n^2}$. Correct.
  2. (B) $vn \propto Z$, not $Z^2$. Incorrect.
  3. (C) Frequency $= \frac{v}{2\pi r} \propto \frac{Z/n}{n^2/Z} = \frac{Z^2}{n^3}$, not $\frac{Z^3}{n^3}$. Incorrect.
  4. (D) Force $\propto \frac{Z}{r^2} \propto \frac{Z\cdot Z^2}{n^4} = \frac{Z^3}{n^4}$. Correct.
  5. So (A) and (D) only (the final NTA key).
  Answer: (B)
C A 10: |-
  Concept: Drug classes (chemistry in everyday life).
  Solution:
  1. Valium: tranquilizer, (a)–(iv).
  2. Morphine: narcotic analgesic, (b)–(iii).
  3. Norethindrone: synthetic progestogen used as an antifertility drug, (c)–(i).
  4. Vitamin $B_{12}$: its deficiency causes pernicious anaemia, (d)–(ii).
  Answer: (D)
C A 11: |-
  Concept: For ionic solids, a higher lattice energy (smaller ions, higher charges) gives a higher melting point.
  Solution:
  1. LiF vs LiCl: F⁻ is smaller than Cl⁻, so LiF has the higher lattice energy: LiF > LiCl.
  2. MgO vs NaCl: MgO has doubly charged small ions ($Mg^{2+}$, $O^{2-}$), so MgO > NaCl (about 2852 °C vs 801 °C).
  Answer: (B)
C A 12: |-
  Concept: Spin-only magnetic moment $\mu = \sqrt{n(n + 2)}$ BM, with n = number of unpaired electrons.
  Solution:
  1. $[FeCl_4]^{2-}$: $Fe^{2+}$ ($d^6$), tetrahedral with weak-field Cl⁻, 4 unpaired: $\sqrt{24} = 4.90$ BM.
  2. $[Co(C_2O_4)_3]^{3-}$: $Co^{3+}$ ($d^6$), octahedral, low spin ($t_{2g}^6$), 0 unpaired: 0 BM.
  3. $MnO_4^{2-}$: Mn(VI), $d^1$, 1 unpaired: $\sqrt{3} = 1.73$ BM.
  Answer: (C)
C A 13: |-
  Concept: Wolff–Kishner reduction converts C=O into $CH_2$ and leaves C=C bonds untouched.
  Solution:
  1. The product keeps both C=C double bonds, and only the carbonyl becomes $CH_2$.
  2. $NH_2NH_2$ followed by a strong base ($C_2H_5O^-Na^+$) and heat does exactly this.
  3. Ni/$H_2$ would also reduce the C=C bonds, $NaBH_4$ gives an alcohol, and red P + $Cl_2$ does not reduce C=O.
  Answer: (B)
C A 14: |-
  Concept: Only primary aromatic amines give stable diazonium salts that couple with β-naphthol to form azo dyes.
  Solution:
  1. Aniline is a primary aromatic amine and gives $C_6H_5N_2^+Cl^-$, which couples to an orange-red azo dye.
  2. Benzylamine is a primary aliphatic amine; its diazonium salt decomposes, giving no dye.
  3. N-methylaniline and N,N-dimethylaniline are secondary and tertiary amines and do not form diazonium salts.
  Answer: (C)
C A 15: |-
  Concept: Use the meta-directing $-NO_2$ group first, then convert it to Br through a diazonium salt.
  Solution:
  1. $Br_2$/Fe: nitrobenzene → m-bromonitrobenzene ($-NO_2$ directs meta).
  2. Sn/HCl: reduce $-NO_2$ to $-NH_2$ → m-bromoaniline.
  3. $NaNO_2$/HCl (0–5 °C): diazonium salt.
  4. CuBr/HBr (Sandmeyer): replace $-N_2^+$ by Br → m-dibromobenzene.
  Answer: (D)
C A 16: |-
  Concept: VSEPR theory.
  Solution:
  1. In $I_3^-$ the central I has 2 bond pairs and 3 lone pairs (5 electron pairs, $sp^3d$).
  2. The three lone pairs take the equatorial positions, so the two I atoms are axial.
  3. Shape: linear, I–I–I angle 180°.
  Answer: (C)
C A 17: |-
  Concept: Density of 3d metals increases across the series (atomic mass rises while metallic radius falls), except Zn.
  Solution:
  1. Approximate densities (g cm⁻³): Zn 7.14, Cr 7.19, Fe 7.87, Co 8.90, Cu 8.96.
  2. Zn is lowest because of its weak metallic bonding (no unpaired d electrons).
  3. Order: Zn < Cr < Fe < Co < Cu.
  Answer: (D)
C A 18: |-
  Concept: Named reactions for functional-group conversions.
  Solution:
  1. RCOCl → RCHO: Rosenmund reduction, $H_2$/Pd–$BaSO_4$, (a)–(ii).
  2. $RCH_2COOH$ → RCH(Cl)COOH: Hell–Volhard–Zelinsky, $Cl_2$/red P then $H_2O$, (b)–(iv).
  3. $RCONH_2$ → $RNH_2$: Hoffmann bromamide, $Br_2$/NaOH, (c)–(i).
  4. $RCOCH_3$ → $RCH_2CH_3$: Clemmensen reduction, Zn(Hg)/conc. HCl, (d)–(iii).
  Answer: (D)
C A 19: |-
  Concept: Buna-S is a copolymer of 1,3-butadiene and styrene.
  Solution:
  1. "Bu" = butadiene, "Na" = sodium (the polymerisation catalyst), "S" = styrene.
  Answer: (A)
C A 20: |-
  Concept: Blood is a negatively charged colloid; it is coagulated best by ions of opposite charge and high valency (Hardy–Schulze rule).
  Solution:
  1. $Fe^{3+}$ has the highest positive charge among the options.
  2. $FeCl_3$ therefore coagulates (clots) blood most effectively; it is used to stop bleeding from small cuts.
  Answer: (D)
C B 1: |-
  Concept: Nernst equation for $MnO_4^- + 8H^+ + 5e^- \rightarrow Mn^{2+} + 4H_2O$.
  Solution:
  1. $E = E^\circ - \frac{0.059}{5}\log\frac{[Mn^{2+}]}{[MnO_4^-][H^+]^8}$.
  2. With $[MnO_4^-]$ and $[Mn^{2+}]$ fixed, $\Delta E = \frac{0.059}{5}\times8\times\Delta\log[H^+] = \frac{0.059\times8\times4}{5}$.
  3. $\Delta E = 0.3776$ V $= 3776\times10^{-4}$ V (the couple becomes a weaker oxidant).
  Answer: 3776
C B 2: |-
  Concept: Paramagnetism needs unpaired electrons.
  Solution:
  1. α- and β-sulphur consist of $S_8$ rings in which all electrons are paired, so they are diamagnetic.
  2. In the vapour, $S_2$ is formed; like $O_2$ it has two unpaired electrons in π* orbitals, so it is paramagnetic.
  3. Number = 1.
  Answer: 1
C B 3: |-
  Concept: Depression of freezing point, $\Delta T_f = K_f\,m$.
  Solution:
  1. Moles of butane $= \frac{10}{58} = 0.172$; molality $= \frac{0.172}{0.200} = 0.862$ m.
  2. $\Delta T_f = 5.12\times0.862 = 4.41$ °C.
  3. Freezing point $= 5.5 - 4.41 = 1.09 \approx 1$ °C.
  Answer: 1
C B 4: |-
  Concept: Ideal gas equation, $V = \frac{nRT}{P}$.
  Solution:
  1. $n = \frac{4.75}{26} = 0.183$ mol; T = 323 K; $P = \frac{740}{760} = 0.974$ atm.
  2. $V = \frac{0.183\times0.0826\times323}{0.974} \approx 5.0$ L.
  Answer: 5
C B 5: |-
  Concept: Common-ion effect on solubility.
  Solution:
  1. $PbI_2 \rightleftharpoons Pb^{2+} + 2I^-$; with 0.1 M $Pb(NO_3)_2$, $[Pb^{2+}] \approx 0.1$ M and $[I^-] = 2s$.
  2. $K_{sp} = 0.1\times(2s)^2 = 8\times10^{-9} \Rightarrow s^2 = 2\times10^{-8}$.
  3. $s = 1.41\times10^{-4} = 141\times10^{-6}$ mol/L.
  Answer: 141
C B 6: |-
  Concept: Gabriel phthalimide synthesis makes primary amines by an $S_N2$ reaction of potassium phthalimide with alkyl halides.
  Solution:
  1. Isobutylamine, ethylamine and benzylamine come from primary / benzylic halides, so they can be made.
  2. Aniline cannot, because aryl halides do not undergo $S_N2$ with phthalimide.
  3. Total = 3.
  Answer: 3
C B 7: |-
  Concept: Stoichiometry with a percentage loss.
  Solution:
  1. $C_6H_5NH_2$ (M = 93) → $C_6H_5NHCOCH_3$ (M = 135), 1 : 1.
  2. Moles of aniline $= \frac{1.86}{93} = 0.02$, so acetanilide formed = 0.02 × 135 = 2.70 g.
  3. After 10% loss: 2.70 × 0.9 = 2.43 g $= 243\times10^{-2}$ g.
  Answer: 243
C B 8: |-
  Concept: Combustion $C_xH_y + \left(x + \frac{y}{4}\right)O_2 \rightarrow xCO_2 + \frac{y}{2}H_2O$; gas volumes are proportional to moles.
  Solution:
  1. $CO_2$ volume = 4 times, so x = 4.
  2. $O_2$ volume = 6 times: $4 + \frac{y}{4} = 6 \Rightarrow y = 8$ ($C_4H_8$).
  Answer: 8
C B 9: |-
  Concept: First-order reaction: fraction remaining $f = \left(\frac{1}{2}\right)^{t/t_{1/2}}$.
  Solution:
  1. Number of half-lives $= \frac{9}{3.33} = 2.70$.
  2. $\log_{10}\frac{1}{f} = 2.70\times\log_{10}2 = 2.70\times0.301 = 0.813$.
  3. $= 81\times10^{-2}$.
  Answer: 81
C B 10: |-
  Concept: $\Delta_rG^\circ = \sum\Delta_fG^\circ(\text{products}) - \sum\Delta_fG^\circ(\text{reactants})$ and $\Delta_rG^\circ = -2.303RT\log K$.
  Solution:
  1. $\Delta_rG^\circ = -1.24\times10^5 - 3(-2.04\times10^5) = 4.88\times10^5$ J mol⁻¹ (using the values as given).
  2. $\log K = -\frac{4.88\times10^5}{2.303\times8.314\times298} = -\frac{4.88\times10^5}{5706} = -85.5$.
  3. Magnitude = 85.5 $= 855\times10^{-1}$.
  Answer: 855
