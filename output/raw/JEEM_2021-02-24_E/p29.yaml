- n: 9
  s: M
  sec: A
  p: 32
  t: S
  q: |-
    Let $f : \mathbb{R} \rightarrow \mathbb{R}$ be defined as $f(x) = \begin{cases} -55x, & \text{if } x < -5 \\ 2x^3 - 3x^2 - 120x, & \text{if } -5 \le x \le 4 \\ 2x^3 - 3x^2 - 36x - 336, & \text{if } x > 4 \end{cases}$. Let $A = \{x \in \mathbb{R} : f$ is increasing$\}$. Then A is equal to :
  o: ['$(-5, -4) \cup (4, \infty)$', '$(-5, \infty)$', '$(-\infty, -5) \cup (4, \infty)$', '$(-\infty, -5) \cup (-4, \infty)$']
  a: A
  ch: Application of Derivatives
  tp: Monotonicity of piecewise function
