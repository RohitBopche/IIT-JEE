    Let $g(x) = \int_0^xf(t)\,dt$, where f is continuous function in [0, 3] such that $\frac{1}{3} \le f(t) \le 1$ for all $t \in [0, 1]$ and $0 \le f(t) \le \frac{1}{2}$ for all $t \in (1, 3]$. The largest possible interval in which g(3) lies is :
  o: ['$\left[-1, -\frac{1}{2}\right]$', '$\left[-\frac{3}{2}, -1\right]$', '$\left[\frac{1}{3}, 2\right]$', '[1, 3]']
