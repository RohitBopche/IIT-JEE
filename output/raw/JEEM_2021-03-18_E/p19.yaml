  q: |-
    Consider hyperbola H : $x^2 - 2y^2 = 4$. Let the tangent at a point $P(4, \sqrt{6})$ meet the x-axis at Q and latus rectum at $R(x_1, y_1)$, $x_1 > 0$. If F is a focus of H which is nearer to the point P, then the area of $\triangle QFR$ is equal to
  o: ['$4\sqrt{6}$', '$\sqrt{6} - 1$', '$\frac{7}{\sqrt{6}} - 2$', '$4\sqrt{6} - 1$']
  a: C
  ch: Conic Sections
  tp: Tangent to hyperbola, area
  df: M
