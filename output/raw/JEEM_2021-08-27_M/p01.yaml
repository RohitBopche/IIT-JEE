  t: S
  q: |-
    A uniformly charged disc of radius R having surface charge density $\sigma$ is placed in the xy plane with its center at the origin. Find the electric field intensity along the z-axis at a distance Z from origin :-
  o: ['$E = \frac{\sigma}{2\varepsilon_0}\left(1 - \frac{Z}{(Z^2 + R^2)^{1/2}}\right)$', '$E = \frac{\sigma}{2\varepsilon_0}\left(1 + \frac{Z}{(Z^2 + R^2)^{1/2}}\right)$', '$E = \frac{2\varepsilon_0}{\sigma}\left(\frac{1}{(Z^2 + R^2)^{1/2}} + Z\right)$', '$E = \frac{\sigma}{2\varepsilon_0}\left(\frac{1}{(Z^2 + R^2)} + \frac{1}{Z^2}\right)$']
  a: A
  ch: Electrostatics
  tp: Field on axis of charged disc
  df: M
