- n: 2
  s: M
  sec: B
  p: 22
  t: N
  q: |-
    Let $f : [-1, 1] \rightarrow \mathbb{R}$ be defined as $f(x) = ax^2 + bx + c$ for all $x \in [-1, 1]$, where a, b, $c \in \mathbb{R}$ such that f(–1) = 2, f'(–1) = 1 and for $x \in (-1, 1)$ the maximum value of f''(x) is $\frac{1}{2}$. If $f(x) \le \alpha$, $x \in [-1, 1]$, then the least value of $\alpha$ is equal to ______.
  a: '5'
  ch: Application of Derivatives
  tp: Quadratic function bounds
  df: M
- n: 3
  s: M
  sec: B
  p: 22
  t: N
  q: |-
    Let $f : [-3, 1] \rightarrow \mathbb{R}$ be given as $f(x) = \begin{cases} \min\{(x + 6), x^2\}, & -3 \le x \le 0 \\ \max\{\sqrt{x}, x^2\}, & 0 \le x \le 1 \end{cases}$. If the area bounded by y = f(x) and x-axis is A, then the value of 6A is equal to ______.
  a: '41'
  ch: Area Under Curves
  tp: Area of piecewise function
  df: M
- n: 4
  s: M
  sec: B
  p: 22
  t: N
  q: |-
    Let $\tan\alpha$, $\tan\beta$ and $\tan\gamma$; $\alpha, \beta, \gamma \neq \frac{(2n - 1)\pi}{2}$, $n \in \mathbb{N}$ be the slopes of three line segments OA, OB and OC, respectively, where O is origin. If circumcentre of $\triangle ABC$ coincides with origin and its orthocentre lies on y-axis, then the value of $\left(\frac{\cos3\alpha + \cos3\beta + \cos3\gamma}{\cos\alpha\cos\beta\cos\gamma}\right)^2$ is equal to :
  a: '144'
  ch: Trigonometric Functions and Equations
  tp: Triangle centres, trigonometric identity
  df: H
- n: 5
  s: M
  sec: B
  p: 23
  t: N
  q: |-
    Consider a set of 3n numbers having variance 4. In this set, the mean of first 2n numbers is 6 and the mean of the remaining n numbers is 3. A new set is constructed by adding 1 into each of first 2n numbers, and subtracting 1 from each of the remaining n numbers. If the variance of the new set is k, then 9k is equal to ______.
  a: '68'
  ch: Statistics
  tp: Variance of modified data
  df: H
- n: 6
  s: M
  sec: B
  p: 23
  t: N
  q: |-
    Let the coefficients of third, fourth and fifth terms in the expansion of $\left(x + \frac{a}{x^2}\right)^n$, $x \neq 0$, be in the ratio 12 : 8 : 3. Then the term independent of x in the expansion, is equal to _______.
  a: '4'
  ch: Binomial Theorem
  tp: Ratio of coefficients
  df: M
  nt: 'computed value 15/4; nearest integer 4'
