  s: P
  sec: A
  p: 1
  t: S
  q: |-
    A block of mass m slides along a floor while a force of magnitude F is applied to it at an angle $\theta$ as shown in figure. The coefficient of kinetic friction is $\mu_K$. Then, the block's acceleration 'a' is given by : (g is acceleration due to gravity)
  o: ['$-\frac{F}{m}\cos\theta - \mu_K\left(g - \frac{F}{m}\sin\theta\right)$', '$\frac{F}{m}\cos\theta - \mu_K\left(g - \frac{F}{m}\sin\theta\right)$', '$\frac{F}{m}\cos\theta - \mu_K\left(g + \frac{F}{m}\sin\theta\right)$', '$\frac{F}{m}\cos\theta + \mu_K\left(g - \frac{F}{m}\sin\theta\right)$']
  a: B
  ch: Laws of Motion
  tp: Friction with inclined force
  df: E
  fig: [[1, 675, 650, 730, 770]]
