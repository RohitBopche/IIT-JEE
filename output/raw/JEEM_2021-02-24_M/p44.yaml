    Let $B_i$ (i=1, 2, 3) be three independent events in a sample space. The probability that only $B_1$ occur is $\alpha$, only $B_2$ occurs is $\beta$ and only $B_3$ occurs is $\gamma$. Let p be the probability that none of the events $B_i$ occurs and these 4 probabilities satisfy the equations $(\alpha - 2\beta)p = \alpha\beta$ and $(\beta - 3\gamma)p = 2\beta\gamma$ (All the probabilities are assumed to lie in the interval (0, 1)). Then $\frac{P(B_1)}{P(B_3)}$ is equal to ____
  a: '6'
