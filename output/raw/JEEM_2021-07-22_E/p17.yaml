- n: 3
  s: M
  sec: B
  p: 17
  t: N
  q: |-
    Let y = y(x) be the solution of the differential equation $\left((x + 2)e^{\left(\frac{y+1}{x+2}\right)} + (y + 1)\right)dx = (x + 2)dy$, y(1) = 1. If the domain y = y(x) is an open interval ($\alpha$, $\beta$), then $|\alpha + \beta|$ is equal to.........
  ch: Differential Equations
  tp: Homogeneous differential equation
  df: H
  nt: 'official 4 takes the domain as 0 < |x+2| < 3e^(e^(-2/3)) (both sides of x = -2); the solution through (1,1) actually lives only on (-2, 3e^(e^(-2/3)) - 2), giving |alpha+beta| about 1.01'
